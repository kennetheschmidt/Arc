name: Diagnose Region Handling

# One-time diagnostic. Manual trigger only - never scheduled.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/arc-raiders-info-app-mAiP1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Probe region parameters and dump schedule
        run: |
          API="https://metaforge.app/api/arc-raiders/events-schedule"
          mkdir -p /tmp/probe
          # Baseline plus a handful of plausible region parameter names.
          for q in "" "region=NA" "server=NA" "serverRegion=NA" "server_region=NA" "zone=NA" "r=NA"; do
            name=$(echo "${q:-baseline}" | tr '=&' '__')
            url="$API"
            [ -n "$q" ] && url="$API?$q"
            curl -sf -H "Accept: application/json" "$url" -o "/tmp/probe/$name.json" || echo "FAILED $name"
            sleep 2
          done
          python3 - <<'PY'
          import json, os, hashlib, datetime, collections

          probe = '/tmp/probe'
          out = []

          # --- Part 1: did any parameter change the response? ---
          out.append('=== PARAMETER PROBE ===')
          digests = {}
          for fn in sorted(os.listdir(probe)):
              path = os.path.join(probe, fn)
              try:
                  raw = open(path, 'rb').read()
              except OSError:
                  continue
              digests[fn] = hashlib.sha256(raw).hexdigest()[:16]
          base = digests.get('baseline.json')
          for fn, dg in digests.items():
              same = 'SAME as baseline' if dg == base else '*** DIFFERENT ***'
              out.append(f'{fn:28} {dg}  {same}')

          # --- Part 2: does the EU feed contain the known NA slots? ---
          out.append('')
          out.append('=== NA SIGNATURE SEARCH ===')
          d = json.load(open(os.path.join(probe, 'baseline.json')))
          arr = d if isinstance(d, list) else d.get('data', [])
          out.append(f'events in feed: {len(arr)}')

          slots = collections.defaultdict(set)
          for e in arr:
              slots[e['startTime']].add((e['name'], e['map']))

          # Ground truth captured from a logged-in NA view on 2026-09-19,
          # for the block running 11:00-12:00 local time.
          na_active = {
              ('Close Scrutiny', 'Buried City'),
              ('Night Raid', 'Spaceport'),
              ('Matriarch', 'Dam'),
              ('Uncovered Caches', 'Blue Gate'),
          }
          na_next = {
              ('Bird City', 'Buried City'),
              ('Night Raid', 'Stella Montis'),
              ('Harvester', 'Dam'),
              ('Electromagnetic Storm', 'Blue Gate'),
          }

          UTC = datetime.timezone.utc

          def iso(ms):
              return datetime.datetime.fromtimestamp(ms / 1000, UTC).strftime('%Y-%m-%d %H:%M UTC')

          def anchor(y, mo, d, h):
              return int(datetime.datetime(y, mo, d, h, tzinfo=UTC).timestamp() * 1000)

          # The user is in PDT (UTC-7); the observed 11:00 local block is 18:00 UTC.
          na_active_at = anchor(2026, 9, 19, 18)
          na_next_at = anchor(2026, 9, 19, 19)

          def report(label, sig, observed_at):
              out.append(f'-- {label} (NA has this at {iso(observed_at)}) --')
              exact, partial = [], []
              for st, evs in slots.items():
                  if evs == sig:
                      exact.append(st)
                  elif len(evs & sig) >= 3:
                      partial.append((len(evs & sig), st, evs))
              if exact:
                  for st in sorted(exact):
                      delta = (st - observed_at) / 3600000
                      out.append(f'  EXACT MATCH at {iso(st)}  => offset {delta:+.0f}h')
              else:
                  out.append('  no exact match')
              for n, st, evs in sorted(partial, reverse=True)[:3]:
                  delta = (st - observed_at) / 3600000
                  out.append(f'  partial ({n}/4) at {iso(st)} ({delta:+.0f}h): {sorted(evs)}')

          report('NA active block', na_active, na_active_at)
          report('NA next block', na_next, na_next_at)

          # --- Part 3: full schedule, for manual inspection ---
          out.append('')
          out.append('=== EU FEED BY SLOT ===')
          for st in sorted(slots):
              names = ', '.join(f'{n} [{m}]' for n, m in sorted(slots[st]))
              out.append(f'{iso(st)}  {names}')

          open('region-diagnostic.txt', 'w').write('\n'.join(out) + '\n')
          print('\n'.join(out[:40]))
          PY

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add region-diagnostic.txt
          git diff --quiet --cached || git commit -m "chore: region diagnostic report"
          git push
