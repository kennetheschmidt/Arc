name: Refresh Game Data

# metaforge asks that consumers cache on their end rather than calling the API
# directly from every visitor's browser, so we snapshot each endpoint here and
# serve the results same-origin from gh-pages.
#
# Events rotate hourly, so they refresh on a schedule. Items, arcs, quests and
# traders are reference data that only move on a game patch - refresh those by
# running this manually with scope "all".
on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      scope:
        description: 'What to refresh'
        type: choice
        options:
          - all
          - events
        default: all

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Snapshot metaforge endpoints
        # Scheduled runs supply no input, so they fall through to events only.
        env:
          SCOPE: ${{ inputs.scope || 'events' }}
        run: |
          mkdir -p data
          python3 - <<'PY'
          import json, os, time, urllib.request

          BASE = 'https://metaforge.app/api/arc-raiders'
          PAGE_LIMIT = 500      # server caps this; we just follow hasNextPage
          MAX_PAGES = 25        # hard stop so a broken cursor can't loop

          scope = os.environ.get('SCOPE', 'events')

          def get(url):
              req = urllib.request.Request(url, headers={
                  'Accept': 'application/json',
                  'User-Agent': 'github.com/kennetheschmidt/Arc (static site cache)',
              })
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.loads(r.read().decode())

          def snapshot(name, path, params=''):
              """Follow pagination and merge every page's data into one document."""
              merged = None
              page = 1
              while page <= MAX_PAGES:
                  qs = f'limit={PAGE_LIMIT}&page={page}'
                  if params:
                      qs = f'{params}&{qs}'
                  url = f'{BASE}{path}?{qs}'
                  try:
                      doc = get(url)
                  except Exception as e:
                      if merged is None:
                          print(f'SKIP {name}: {e}')
                          return
                      print(f'WARN {name}: page {page} failed ({e}); keeping {page-1} page(s)')
                      break

                  data = doc.get('data') if isinstance(doc, dict) else doc

                  # Non-list payloads (e.g. traders is keyed by name) never paginate.
                  if not isinstance(data, list):
                      merged = doc
                      break

                  if merged is None:
                      merged = doc
                  elif isinstance(merged, dict):
                      merged['data'].extend(data)
                  else:
                      merged.extend(data)

                  pg = doc.get('pagination') if isinstance(doc, dict) else None
                  if not pg or not pg.get('hasNextPage'):
                      break
                  page += 1
                  time.sleep(1)

              if merged is None:
                  print(f'SKIP {name}: no data')
                  return

              got = merged.get('data') if isinstance(merged, dict) else merged
              if isinstance(got, list) and isinstance(merged, dict):
                  pg = merged.get('pagination')
                  if pg:
                      total = pg.get('total')
                      merged['pagination'] = {
                          'page': 1, 'limit': len(got), 'total': total,
                          'totalPages': 1, 'hasNextPage': False, 'hasPrevPage': False,
                      }
                      if total is not None and len(got) != total:
                          print(f'WARN {name}: captured {len(got)} of {total}')
                  print(f'OK   {name}: {len(got)} records')
              else:
                  print(f'OK   {name}: non-list payload')

              with open(f'data/{name}.json', 'w') as f:
                  json.dump(merged, f)

          print(f'scope: {scope}')
          snapshot('events', '/events-schedule')
          if scope == 'all':
              snapshot('arcs',    '/arcs', 'loot=true')
              snapshot('quests',  '/quests')
              snapshot('items',   '/items')
              snapshot('traders', '/traders')
          PY

          # Keep the legacy path alive for any cached copy of the old page.
          [ -f data/events.json ] && cp data/events.json events-na.json || true

          echo "--- snapshot ---"
          ls -la data/

      - name: Commit snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data events-na.json
          git diff --quiet --cached || git commit -m "chore: refresh game data (${SCOPE}) [skip ci]"
          git push
        env:
          SCOPE: ${{ inputs.scope || 'events' }}
