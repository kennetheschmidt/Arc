name: Harvest Recycling Data

# Manual only. Recycling yields are static until a game patch, so run this
# after a patch, not on a schedule.
#
# The bulk /items endpoint carries no recycling data; it lives in per-item
# files on metaforge's CDN. This probes the known URL patterns, reports the
# shape it finds, then harvests every item into data/recycling.json.
on:
  workflow_dispatch:
    inputs:
      probe_only:
        description: 'Probe a few items and report the shape, without harvesting'
        type: boolean
        default: false
      refetch_all:
        description: 'Re-fetch every item instead of only ones not yet checked'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Probe and harvest
        env:
          PROBE_ONLY: ${{ inputs.probe_only }}
          REFETCH_ALL: ${{ inputs.refetch_all }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request

          BASE = 'https://metaforge.app/api/arc-raiders/items'
          probe_only = os.environ.get('PROBE_ONLY') == 'true'

          def get(url):
              req = urllib.request.Request(url, headers={
                  'Accept': 'application/json',
                  'User-Agent': 'github.com/kennetheschmidt/Arc (static site cache)',
              })
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.loads(r.read().decode())

          # metaforge documents this endpoint as supporting "component
          # relationships", so look for the parameter that turns them on
          # rather than fetching a thousand per-item files.
          CANDIDATES = [
              'components=true', 'include=components', 'expand=components',
              'relations=true', 'include=relations', 'expand=relations',
              'recycling=true', 'include=recycling', 'full=true', 'details=true',
          ]

          base = get(f'{BASE}?limit=1&page=1')
          sample = (base.get('data') or [{}])[0]
          base_keys = set(sample)
          print(f'baseline item: {sample.get("name")}')
          print(f'baseline keys ({len(base_keys)}): {sorted(base_keys)}')
          print()

          winner = None
          for q in CANDIDATES:
              try:
                  d = get(f'{BASE}?limit=1&page=1&{q}')
              except Exception as e:
                  print(f'  {q:24} failed: {e}')
                  time.sleep(0.5)
                  continue
              it = (d.get('data') or [{}])[0]
              new = set(it) - base_keys
              changed = [k for k in base_keys & set(it)
                         if json.dumps(it.get(k), sort_keys=True, default=str)
                         != json.dumps(sample.get(k), sort_keys=True, default=str)]
              flag = ''
              if new:
                  flag = f'  *** adds {sorted(new)} ***'
                  if winner is None:
                      winner = (q, sorted(new), it)
              elif changed:
                  flag = f'  (differs in {changed})'
              print(f'  {q:24} keys={len(it)}{flag}')
              time.sleep(0.5)

          print()
          if not winner:
              print('No parameter exposed extra fields.')
              print('\nFull baseline record, for designing against what IS available:')
              print(json.dumps(sample, indent=2)[:2500])
              raise SystemExit('no component-relationship parameter found')

          q, new, it = winner
          print(f'WINNER: {q}  adds {new}')
          print(json.dumps({k: it[k] for k in new}, indent=2)[:2000])

          if probe_only:
              raise SystemExit(0)

          # Harvest the whole catalogue with that parameter, paginated.
          merged, page = None, 1
          while page <= 25:
              d = get(f'{BASE}?{q}&limit=500&page={page}')
              rows = d.get('data') or []
              if merged is None:
                  merged = d
              else:
                  merged['data'].extend(rows)
              pg = d.get('pagination') or {}
              print(f'  page {page}: {len(rows)} rows')
              if not pg.get('hasNextPage'):
                  break
              page += 1
              time.sleep(1)

          rows = merged['data']
          withrel = [r for r in rows if any(r.get(k) for k in new)]
          print(f'\n{len(rows)} items, {len(withrel)} carrying relationship data')
          out = {r['id']: {k: r[k] for k in new if r.get(k)} | {'name': r['name']}
                 for r in withrel}
          with open('data/recycling.json', 'w') as f:
              json.dump({'source': q, 'fields': new, 'items': out}, f)
          print('wrote data/recycling.json')
          PY

      - name: Commit
        if: ${{ !inputs.probe_only }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/recycling.json
          git diff --quiet --cached || git commit -m "chore: harvest recycling data [skip ci]"
          git push
