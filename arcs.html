<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arc Raiders – ARC Units</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0d0f14;
      --surface:  #141720;
      --surface2: #1c2030;
      --border:   #2a2f42;
      --accent:   #e8a020;
      --text:     #e2e8f0;
      --muted:    #6b7280;
      --danger:   #ef4444;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── HEADER ── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo svg { color: var(--accent); }

    .logo h1 {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .logo h1 span { color: var(--accent); }

    /* ── NAV ── */
    nav {
      display: flex;
      gap: 6px;
    }

    .nav-link {
      padding: 6px 14px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      font-size: 0.82rem;
      text-decoration: none;
      transition: all 0.15s;
    }

    .nav-link:hover { border-color: var(--accent); color: var(--accent); }
    .nav-link.active { background: var(--accent); border-color: var(--accent); color: #000; font-weight: 600; }

    /* ── SEARCH ── */
    #search-bar {
      padding: 12px 24px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    #search {
      width: 100%;
      max-width: 400px;
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 0.88rem;
      outline: none;
      transition: border-color 0.15s;
    }

    #search:focus { border-color: var(--accent); }
    #search::placeholder { color: var(--muted); }

    /* ── MAIN ── */
    main { padding: 24px; max-width: 1200px; margin: 0 auto; }

    /* ── GRID ── */
    #arc-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }

    /* ── ARC CARD ── */
    .arc-card {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      transition: border-color 0.15s, transform 0.15s;
    }

    .arc-card:hover { border-color: var(--accent); transform: translateY(-2px); }

    .arc-image {
      width: 100%;
      height: 160px;
      object-fit: cover;
      display: block;
      background: var(--surface);
    }

    .arc-card-body {
      padding: 14px;
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    .arc-icon {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      background: var(--surface);
      flex-shrink: 0;
      overflow: hidden;
    }

    .arc-icon img { width: 100%; height: 100%; object-fit: contain; }

    .arc-info { min-width: 0; }

    .arc-name {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text);
    }

    .arc-desc {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 4px;
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* ── MODAL ── */
    #modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 200;
      padding: 24px;
      overflow-y: auto;
    }

    #modal-backdrop.open { display: flex; align-items: flex-start; justify-content: center; }

    #modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      width: 100%;
      max-width: 680px;
      overflow: hidden;
      margin: auto;
    }

    #modal-image {
      width: 100%;
      height: 220px;
      object-fit: cover;
      display: block;
      background: var(--bg);
    }

    #modal-body { padding: 20px; }

    .modal-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 16px;
    }

    .modal-icon {
      width: 52px;
      height: 52px;
      border-radius: 10px;
      background: var(--bg);
      overflow: hidden;
      flex-shrink: 0;
    }

    .modal-icon img { width: 100%; height: 100%; object-fit: contain; }

    #modal-name {
      font-size: 1.3rem;
      font-weight: 700;
    }

    .modal-section {
      margin-top: 16px;
    }

    .modal-section-title {
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 8px;
    }

    #modal-description {
      font-size: 0.85rem;
      color: var(--muted);
      line-height: 1.7;
      white-space: pre-wrap;
    }

    /* HP & Loot placeholders */
    .coming-soon {
      font-size: 0.8rem;
      color: var(--muted);
      font-style: italic;
      padding: 12px;
      border: 1px dashed var(--border);
      border-radius: 8px;
      text-align: center;
    }

    #modal-hp-section,
    #modal-loot-section { display: none; }

    /* Loot table */
    .loot-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.8rem;
    }

    .loot-table th {
      text-align: left;
      color: var(--muted);
      font-weight: 600;
      padding: 6px 8px;
      border-bottom: 1px solid var(--border);
    }

    .loot-table td {
      padding: 7px 8px;
      border-bottom: 1px solid var(--border);
      color: var(--text);
    }

    .loot-table tr:last-child td { border-bottom: none; }

    .rarity {
      display: inline-block;
      padding: 1px 7px;
      border-radius: 4px;
      font-size: 0.7rem;
      font-weight: 700;
    }

    .rarity-common   { background: #374151; color: #9ca3af; }
    .rarity-uncommon { background: #14532d; color: #4ade80; }
    .rarity-rare     { background: #1e3a8a; color: #60a5fa; }
    .rarity-epic     { background: #4a1d96; color: #c084fc; }
    .rarity-legendary{ background: #78350f; color: var(--accent); }

    /* ── CLOSE BTN ── */
    .modal-close {
      float: right;
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
      padding: 0 0 4px 8px;
    }

    .modal-close:hover { color: var(--text); }

    /* ── LOADING / ERROR ── */
    #status {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    #status .spinner {
      width: 32px; height: 32px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
    #status.error { color: var(--danger); }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="none"
         viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round"
            d="M9 3H5a2 2 0 00-2 2v4m6-6h10a2 2 0 012 2v4M9 3v18m0 0h10a2 2 0 002-2V9M9 21H5a2 2 0 01-2-2V9m0 0h18"/>
    </svg>
    <h1>Arc Raiders <span>ARC Units</span></h1>
  </div>
  <nav>
    <a href="index.html" class="nav-link">Events</a>
    <a href="arcs.html"  class="nav-link active">ARC Units</a>
  </nav>
</header>

<div id="search-bar">
  <input id="search" type="search" placeholder="Search ARC units…" autocomplete="off" />
</div>

<main>
  <div id="status"><div class="spinner"></div>Loading ARC units…</div>
  <div id="arc-grid" style="display:none"></div>
</main>

<!-- MODAL -->
<div id="modal-backdrop">
  <div id="modal">
    <img id="modal-image" src="" alt="" />
    <div id="modal-body">
      <button class="modal-close" id="modal-close">&#x2715;</button>
      <div class="modal-header">
        <div class="modal-icon"><img id="modal-icon" src="" alt="" /></div>
        <div id="modal-name"></div>
      </div>

      <div class="modal-section">
        <div class="modal-section-title">Description</div>
        <div id="modal-description"></div>
      </div>

      <div class="modal-section" id="modal-loot-section">
        <div class="modal-section-title">Loot Table</div>
        <table class="loot-table">
          <thead>
            <tr>
              <th>Item</th>
              <th>Rarity</th>
              <th>Type</th>
            </tr>
          </thead>
          <tbody id="modal-loot"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
  const API_BASE = 'https://corsproxy.io/?url=https://metaforge.app/api/arc-raiders';
  const ARCS_URL = 'https://corsproxy.io/?url=' + encodeURIComponent('https://metaforge.app/api/arc-raiders/arcs?includeLoot=true');

  let allArcs = [];

  // ── FETCH ──────────────────────────────────────────────────────────────────
  async function loadArcs() {
    try {
      const res = await fetch(ARCS_URL);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const json = await res.json();
      allArcs = json.data || [];
      renderGrid(allArcs);
      document.getElementById('status').style.display = 'none';
      document.getElementById('arc-grid').style.display = 'grid';
    } catch (e) {
      const el = document.getElementById('status');
      el.className = 'error';
      el.innerHTML = `&#9888; Failed to load ARC units: ${e.message}<br>
        <button onclick="location.reload()" style="margin-top:12px;padding:8px 20px;
        background:var(--accent);border:none;border-radius:6px;cursor:pointer;
        font-weight:600;color:#000">Retry</button>`;
    }
  }

  // ── RENDER GRID ────────────────────────────────────────────────────────────
  function renderGrid(arcs) {
    const grid = document.getElementById('arc-grid');
    grid.innerHTML = '';
    if (!arcs.length) {
      grid.innerHTML = '<p style="color:var(--muted);font-size:0.85rem">No ARC units found.</p>';
      return;
    }
    arcs.forEach(arc => {
      const card = document.createElement('div');
      card.className = 'arc-card';
      const lootCount = arc.loot?.length ?? 0;
      card.innerHTML = `
        <img class="arc-image" src="${arc.image}" alt="${arc.name}"
             onerror="this.style.display='none'" loading="lazy" />
        <div class="arc-card-body">
          <div class="arc-icon">
            <img src="${arc.icon}" alt="" onerror="this.style.display='none'" loading="lazy" />
          </div>
          <div class="arc-info">
            <div class="arc-name">${arc.name}${lootCount ? `<span style="margin-left:8px;font-size:0.65rem;font-weight:600;padding:2px 7px;border-radius:4px;background:#1c2030;color:var(--muted);vertical-align:middle">${lootCount} drops</span>` : ''}</div>
            <div class="arc-desc">${arc.description || 'No description available.'}</div>
          </div>
        </div>`;
      card.addEventListener('click', () => openModal(arc));
      grid.appendChild(card);
    });
  }

  // ── MODAL ──────────────────────────────────────────────────────────────────
  async function openModal(arc) {
    document.getElementById('modal-image').src       = arc.image;
    document.getElementById('modal-image').alt       = arc.name;
    document.getElementById('modal-icon').src        = arc.icon;
    document.getElementById('modal-name').textContent = arc.name;
    document.getElementById('modal-description').textContent = arc.description || 'No description available.';
    document.getElementById('modal-loot-section').style.display = 'none';
    document.getElementById('modal-backdrop').classList.add('open');
    renderLoot(arc);
  }

  const RARITY_ORDER = { Legendary: 0, Epic: 1, Rare: 2, Uncommon: 3, Common: 4 };

  function renderLoot(arc) {
    const loot = arc.loot;
    if (!loot || !loot.length) return;
    const section = document.getElementById('modal-loot-section');
    const tbody   = document.getElementById('modal-loot');
    section.style.display = '';
    const sorted = [...loot].sort((a, b) =>
      (RARITY_ORDER[a.item.rarity] ?? 9) - (RARITY_ORDER[b.item.rarity] ?? 9)
    );
    tbody.innerHTML = sorted.map(({ item }) => `
      <tr>
        <td style="display:flex;align-items:center;gap:8px">
          <img src="${item.icon}" alt="" width="24" height="24"
               style="border-radius:4px;background:var(--surface);flex-shrink:0"
               onerror="this.style.display='none'" loading="lazy">
          ${item.name}
        </td>
        <td><span class="rarity rarity-${item.rarity.toLowerCase()}">${item.rarity}</span></td>
        <td style="color:var(--muted)">${item.item_type}</td>
      </tr>`).join('');
  }

  function closeModal() {
    document.getElementById('modal-backdrop').classList.remove('open');
  }

  document.getElementById('modal-close').addEventListener('click', closeModal);
  document.getElementById('modal-backdrop').addEventListener('click', e => {
    if (e.target === document.getElementById('modal-backdrop')) closeModal();
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

  // ── SEARCH ─────────────────────────────────────────────────────────────────
  document.getElementById('search').addEventListener('input', e => {
    const q = e.target.value.toLowerCase();
    renderGrid(allArcs.filter(a => a.name.toLowerCase().includes(q)));
  });

  // ── BOOT ───────────────────────────────────────────────────────────────────
  loadArcs();
</script>
</body>
</html>
