<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arc Raiders – ARC Units</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0d0f14;
      --surface:  #141720;
      --surface2: #1c2030;
      --border:   #2a2f42;
      --accent:   #e8a020;
      --text:     #e2e8f0;
      --muted:    #6b7280;
      --danger:   #ef4444;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── HEADER ── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo { display: flex; align-items: center; gap: 12px; }
    .logo svg { color: var(--accent); }
    .logo h1 { font-size: 1.25rem; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; }
    .logo h1 span { color: var(--accent); }

    nav { display: flex; gap: 6px; }

    .nav-link {
      padding: 6px 14px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      font-size: 0.82rem;
      text-decoration: none;
      transition: all 0.15s;
    }
    .nav-link:hover { border-color: var(--accent); color: var(--accent); }
    .nav-link.active { background: var(--accent); border-color: var(--accent); color: #000; font-weight: 600; }

    /* ── SEARCH ── */
    #search-bar {
      padding: 12px 24px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    #search {
      width: 100%;
      max-width: 400px;
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 0.88rem;
      outline: none;
      transition: border-color 0.15s;
    }
    #search:focus { border-color: var(--accent); }
    #search::placeholder { color: var(--muted); }

    /* ── MAIN ── */
    main { padding: 24px; max-width: 1200px; margin: 0 auto; }

    #arc-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }

    /* ── ARC CARD ── */
    .arc-card {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      transition: border-color 0.15s, transform 0.15s;
    }
    .arc-card:hover { border-color: var(--accent); transform: translateY(-2px); }

    .arc-image {
      width: 100%;
      height: 160px;
      object-fit: cover;
      display: block;
      background: var(--surface);
    }

    .arc-card-body {
      padding: 14px;
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    .arc-icon {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      background: var(--surface);
      flex-shrink: 0;
      overflow: hidden;
    }
    .arc-icon img { width: 100%; height: 100%; object-fit: contain; }

    .arc-info { min-width: 0; }

    .arc-name { font-size: 0.95rem; font-weight: 700; color: var(--text); }

    .arc-desc {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 4px;
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* ── MODAL ── */
    #modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 200;
      padding: 16px;
      align-items: center;
      justify-content: center;
    }
    #modal-backdrop.open { display: flex; }

    #modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      width: 100%;
      max-width: 680px;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #modal-image {
      width: 100%;
      height: 140px;
      object-fit: cover;
      display: block;
      flex-shrink: 0;
      background: var(--bg);
    }

    #modal-body {
      padding: 20px;
      overflow-y: auto;
      flex: 1;
    }

    .modal-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 16px;
    }

    .modal-icon {
      width: 52px;
      height: 52px;
      border-radius: 10px;
      background: var(--bg);
      overflow: hidden;
      flex-shrink: 0;
    }
    .modal-icon img { width: 100%; height: 100%; object-fit: contain; }

    #modal-name { font-size: 1.3rem; font-weight: 700; }

    .modal-section { margin-top: 16px; }

    .modal-section-title {
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 8px;
    }

    #modal-description {
      font-size: 0.85rem;
      color: var(--muted);
      line-height: 1.7;
      white-space: pre-wrap;
    }

    /* ── LOOT TABLE ── */
    #modal-loot-section { display: none; }

    .loot-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.8rem;
    }
    .loot-table th {
      text-align: left;
      color: var(--muted);
      font-weight: 600;
      padding: 6px 8px;
      border-bottom: 1px solid var(--border);
    }
    .loot-table td {
      padding: 7px 8px;
      border-bottom: 1px solid var(--border);
      color: var(--text);
    }
    .loot-table tr:last-child td { border-bottom: none; }

    .rarity {
      display: inline-block;
      padding: 1px 7px;
      border-radius: 4px;
      font-size: 0.7rem;
      font-weight: 700;
    }
    .rarity-common    { background: #374151; color: #9ca3af; }
    .rarity-uncommon  { background: #14532d; color: #4ade80; }
    .rarity-rare      { background: #1e3a8a; color: #60a5fa; }
    .rarity-epic      { background: #4a1d96; color: #c084fc; }
    .rarity-legendary { background: #78350f; color: var(--accent); }

    .modal-close {
      float: right;
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
      padding: 0 0 4px 8px;
    }
    .modal-close:hover { color: var(--text); }

    /* ── LOADING / ERROR ── */
    #status {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
      font-size: 0.9rem;
    }
    #status .spinner {
      width: 32px; height: 32px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #status.error { color: var(--danger); }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  </style>
</head>

    ],

  let allArcs = [];

  async function loadArcs() {
    try {
      const res = await fetch(PROXY_URL);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const json = await res.json();
      // Merge static loot into each arc
      allArcs = (json.data || []).map(arc => ({ ...arc, loot: LOOT[arc.id] || [] }));
      renderGrid(allArcs);
      document.getElementById('status').style.display = 'none';
      document.getElementById('arc-grid').style.display = 'grid';
    } catch (e) {
      const el = document.getElementById('status');
      el.className = 'error';
      el.innerHTML = `&#9888; Failed to load ARC units: ${e.message}<br>
        <button onclick="location.reload()" style="margin-top:12px;padding:8px 20px;
        background:var(--accent);border:none;border-radius:6px;cursor:pointer;
        font-weight:600;color:#000">Retry</button>`;
    }
  }

  function renderGrid(arcs) {
    const grid = document.getElementById('arc-grid');
    grid.innerHTML = '';
    if (!arcs.length) {
      grid.innerHTML = '<p style="color:var(--muted);font-size:0.85rem">No ARC units found.</p>';
      return;
    }
    arcs.forEach(arc => {
      const card = document.createElement('div');
      card.className = 'arc-card';
      card.innerHTML = `
        <img class="arc-image" src="${arc.image}" alt="${arc.name}"
             onerror="this.style.display='none'" loading="lazy" />
        <div class="arc-card-body">
          <div class="arc-icon">
            <img src="${arc.icon}" alt="" onerror="this.style.display='none'" loading="lazy" />
          </div>
          <div class="arc-info">
            <div class="arc-name">${arc.name}</div>
            <div class="arc-desc">${arc.description || 'No description available.'}</div>
            ${LOOT[arc.id]?.length ? `<a href="loot.html?arc=${arc.id}" onclick="event.stopPropagation()"
              style="display:inline-block;margin-top:8px;font-size:0.72rem;font-weight:600;
              color:var(--accent);text-decoration:none;border:1px solid var(--accent);
              border-radius:4px;padding:3px 10px">View Loot</a>` : ''}
          </div>
        </div>`;
      card.addEventListener('click', () => openModal(arc));
      grid.appendChild(card);
    });
  }

  const RARITY_ORDER = { Legendary: 0, Epic: 1, Rare: 2, Uncommon: 3, Common: 4 };

  // iOS Safari scroll lock
  function lockScroll() {
    const y = window.scrollY;
    document.body.style.position = 'fixed';
    document.body.style.top = `-${y}px`;
    document.body.style.width = '100%';
    document.body.dataset.scrollY = y;
  }
  function unlockScroll() {
    const y = parseInt(document.body.dataset.scrollY || '0');
    document.body.style.position = '';
    document.body.style.top = '';
    document.body.style.width = '';
    window.scrollTo(0, y);
  }

  function openModal(arc) {
    lockScroll();
    document.getElementById('modal-image').src        = arc.image;
    document.getElementById('modal-image').alt        = arc.name;
    document.getElementById('modal-icon').src         = arc.icon;
    document.getElementById('modal-name').textContent = arc.name;
    document.getElementById('modal-description').textContent = arc.description || 'No description available.';
    document.getElementById('modal-loot-section').style.display = 'none';
    document.getElementById('modal-backdrop').classList.add('open');
    renderLoot(arc);
  }

  function renderLoot(arc) {
    if (!arc.loot?.length) return;
    const sorted = [...arc.loot].sort((a, b) =>
      (RARITY_ORDER[a.rarity] ?? 9) - (RARITY_ORDER[b.rarity] ?? 9)
    );
    document.getElementById('modal-loot').innerHTML = sorted.map(item => `
      <tr>
        <td style="display:flex;align-items:center;gap:8px">
          <img src="${item.icon}" alt="" width="24" height="24"
               style="border-radius:4px;background:var(--surface);flex-shrink:0"
               onerror="this.style.display='none'" loading="lazy">
          ${item.name}
        </td>
        <td><span class="rarity rarity-${item.rarity.toLowerCase()}">${item.rarity}</span></td>
        <td style="color:var(--muted)">${item.item_type}</td>
      </tr>`).join('');
    document.getElementById('modal-loot-section').style.display = '';
  }

  function closeModal() {
    document.getElementById('modal-backdrop').classList.remove('open');
    unlockScroll();
  }

  document.getElementById('modal-close').addEventListener('click', closeModal);
  document.getElementById('modal-backdrop').addEventListener('click', e => {
    if (e.target === document.getElementById('modal-backdrop')) closeModal();
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

  document.getElementById('search').addEventListener('input', e => {
    const q = e.target.value.toLowerCase();
    renderGrid(allArcs.filter(a => a.name.toLowerCase().includes(q)));
  });

  loadArcs();
</script>
