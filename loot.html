<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0d0f14;
      --surface:  #141720;
      --surface2: #1c2030;
      --border:   #2a2f42;
      --accent:   #e8a020;
      --text:     #e2e8f0;
      --muted:    #6b7280;
      --danger:   #ef4444;
    }

    body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    /* ── HEADER ── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .rainbow-bar { height: 4px; background: linear-gradient(90deg,#e63946,#e8762a,#f4c430,#4ade80,#38bdf8,#a78bfa); }
    .logo { display: flex; align-items: center; gap: 10px; }
    .wordmark { font-size: 1rem; font-weight: 900; letter-spacing: 0.06em; text-transform: uppercase; line-height: 1.1; }
    .w-arc { color: #fff; }
    .w-raiders { color: #e8423a; font-style: italic; }
    .page-name { font-size: 0.62rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); margin-top: 2px; }

    nav { display: flex; gap: 6px; flex-wrap: wrap; }
    .nav-link {
      padding: 8px 14px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      font-size: 0.82rem;
      text-decoration: none;
      transition: all 0.15s;
    }
    .nav-link:hover { border-color: var(--accent); color: var(--accent); }
    .nav-link.active { background: var(--accent); border-color: var(--accent); color: #000; font-weight: 600; }

    /* ── CONTROLS ── */
    #controls {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    #search {
      flex: 1;
      min-width: 200px;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 0.9rem;
      outline: none;
    }
    #search:focus { border-color: var(--accent); }
    #search::placeholder { color: var(--muted); }

    .filter-btn {
      padding: 8px 14px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .filter-btn:hover { border-color: var(--accent); color: var(--accent); }
    .filter-btn.active { background: var(--accent); border-color: var(--accent); color: #000; font-weight: 600; }

    /* ── MAIN ── */
    main { padding: 20px; max-width: 900px; margin: 0 auto; }

    /* ── LOOT ITEM ROW ── */
    .loot-item {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 10px;
    }

    .loot-icon {
      width: 48px;
      height: 48px;
      border-radius: 8px;
      background: var(--surface);
      flex-shrink: 0;
      overflow: hidden;
    }
    .loot-icon img { width: 100%; height: 100%; object-fit: contain; }

    .loot-info { flex: 1; min-width: 0; }

    .loot-name {
      font-size: 0.95rem;
      font-weight: 600;
    }

    .loot-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 5px;
      flex-wrap: wrap;
    }

    .loot-type {
      font-size: 0.72rem;
      color: var(--muted);
    }

    .loot-sources {
      margin-top: 6px;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .source-tag {
      font-size: 0.7rem;
      padding: 3px 8px;
      border-radius: 4px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
    }

    /* ── RARITY BADGES ── */
    .rarity {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.7rem;
      font-weight: 700;
    }
    .rarity-common    { background: #374151; color: #9ca3af; }
    .rarity-uncommon  { background: #14532d; color: #4ade80; }
    .rarity-rare      { background: #1e3a8a; color: #60a5fa; }
    .rarity-epic      { background: #4a1d96; color: #c084fc; }
    .rarity-legendary { background: #78350f; color: var(--accent); }

    /* ── RARITY GROUP HEADER ── */
    .rarity-group-title {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 20px 0 10px;
    }

    /* ── EMPTY ── */
    .empty { text-align: center; padding: 48px; color: var(--muted); font-size: 0.9rem; }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* ── CLICKABLE ITEM ── */
    .loot-item { cursor: pointer; transition: border-color 0.15s, transform 0.12s; }
    .loot-item:hover { border-color: var(--accent); transform: translateX(3px); }

    /* ── ITEM DETAIL MODAL ── */
    .item-modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      z-index: 200;
      align-items: flex-end;
      justify-content: center;
    }
    .item-modal-overlay.open { display: flex; }
    .item-modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px 16px 0 0;
      width: 100%;
      max-width: 620px;
      max-height: 82vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .item-modal-head {
      padding: 18px 18px 0;
      flex-shrink: 0;
    }
    .item-modal-top {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 14px;
    }
    .item-modal-icon {
      width: 52px; height: 52px;
      border-radius: 8px;
      background: var(--surface2);
      object-fit: contain;
      flex-shrink: 0;
    }
    .item-modal-title { font-size: 1.05rem; font-weight: 700; }
    .item-modal-sub { font-size: 0.78rem; color: var(--muted); margin-top: 3px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

    /* ── TABS ── */
    .item-tabs {
      display: flex;
      gap: 0;
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
      scrollbar-width: none;
    }
    .item-tabs::-webkit-scrollbar { display: none; }
    .item-tab {
      padding: 10px 14px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      cursor: pointer;
      white-space: nowrap;
      border-bottom: 2px solid transparent;
      transition: color 0.15s, border-color 0.15s;
      user-select: none;
    }
    .item-tab:hover { color: var(--text); }
    .item-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
    .item-tab .tab-count {
      display: inline-block;
      background: var(--surface2);
      border-radius: 10px;
      padding: 1px 6px;
      font-size: 0.65rem;
      margin-left: 4px;
    }

    /* ── TAB BODY ── */
    .item-modal-body {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 0;
    }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    .detail-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
    }
    .detail-table th {
      text-align: left;
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      padding: 10px 18px 6px;
      border-bottom: 1px solid var(--border);
    }
    .detail-table td {
      padding: 9px 18px;
      border-bottom: 1px solid rgba(42,47,66,0.5);
      vertical-align: middle;
    }
    .detail-table tr:last-child td { border-bottom: none; }
    .detail-img {
      width: 26px; height: 26px;
      border-radius: 4px;
      background: var(--surface2);
      object-fit: contain;
      margin-right: 8px;
      vertical-align: middle;
    }
    .detail-empty {
      padding: 32px 18px;
      color: var(--muted);
      font-size: 0.85rem;
      text-align: center;
    }
    .detail-loading {
      padding: 32px 18px;
      color: var(--muted);
      font-size: 0.85rem;
      text-align: center;
    }
    .detail-spinner {
      width: 24px; height: 24px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto 10px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .item-modal-close {
      display: block;
      width: calc(100% - 36px);
      margin: 12px 18px;
      padding: 11px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      flex-shrink: 0;
    }
  </style>
</head>

      { name: 'Advanced ARC Powercell',            rarity: 'Rare',      item_type: 'Topside Material', icon: CDN+'advanced-arc-powercell.webp' },
      { name: 'Sensors',                           rarity: 'Rare',      item_type: 'Topside Material', icon: CDN+'sensors-recipe.webp' },

    ],
    'tick': [

      { name: 'ARC Alloy', rarity: 'Uncommon', item_type: 'Topside Material', icon: CDN+'arc-alloy.webp' },
    ],
    'turret': [
      { name: 'ARC Alloy',        rarity: 'Uncommon', item_type: 'Topside Material', icon: CDN+'arc-alloy.webp' },
      { name: 'Simple Gun Parts', rarity: 'Uncommon', item_type: 'Topside Material', icon: CDN+'simple-gun-parts.webp' },
      { name: 'Light Ammo',       rarity: 'Common',   item_type: 'Ammunition',       icon: CDN+'light-ammo.webp' },
    ],
    'wasp': [
      { name: 'Wasp Driver',   rarity: 'Rare',     item_type: 'Recyclable',       icon: CDN+'wasp-driver.webp' },
      { name: 'ARC Alloy',    rarity: 'Uncommon', item_type: 'Topside Material', icon: CDN+'arc-alloy.webp' },
      { name: 'ARC Powercell',rarity: 'Common',   item_type: 'Topside Material', icon: CDN+'arc-powercell.webp' },
      { name: 'Light Ammo',   rarity: 'Common',   item_type: 'Ammunition',       icon: CDN+'light-ammo.webp' },
    ],
  };

  const RARITY_ORDER = { Legendary: 0, Epic: 1, Rare: 2, Uncommon: 3, Common: 4 };

  // Build inverted index: item name → { icon, rarity, item_type, sources: [arcId...] }
  function buildIndex() {
    const index = new Map();
    for (const [arcId, items] of Object.entries(LOOT)) {
      for (const item of items) {
        if (!index.has(item.name)) {
          index.set(item.name, { ...item, sources: [] });
        }
        index.get(item.name).sources.push(arcId);
      }
    }
    return [...index.values()].sort((a, b) =>
      (RARITY_ORDER[a.rarity] ?? 9) - (RARITY_ORDER[b.rarity] ?? 9) || a.name.localeCompare(b.name)
    );
  }

  let allItems = buildIndex();
  let activeRarity = 'all';

  function render(query = '') {
    const q = query.toLowerCase();
    const items = allItems.filter(item =>
      (activeRarity === 'all' || item.rarity === activeRarity) &&
      (!q || item.name.toLowerCase().includes(q) || item.item_type.toLowerCase().includes(q))
    );

    const main = document.getElementById('main');
    if (!items.length) {
      main.innerHTML = '<div class="empty">No items found.</div>';
      return;
    }

    // Group by rarity when showing all
    if (activeRarity === 'all') {
      const groups = {};
      for (const item of items) {
        if (!groups[item.rarity]) groups[item.rarity] = [];
        groups[item.rarity].push(item);
      }
      main.innerHTML = Object.entries(RARITY_ORDER)
        .filter(([r]) => groups[r])
        .map(([r]) => `
          <div class="rarity-group-title">${r}</div>
          ${groups[r].map(renderItem).join('')}
        `).join('');
    } else {
      main.innerHTML = items.map(renderItem).join('');
    }
  }

  function renderItem(item) {
    const sources = item.sources.map(id =>
      `<span class="source-tag">${ARC_NAMES[id] ?? id}</span>`
    ).join('');
    return `
      <div class="loot-item" data-name="${item.name.replace(/"/g,'&quot;')}">
        <div class="loot-icon">
          <img src="${item.icon}" alt="${item.name}" loading="lazy" onerror="this.style.display='none'">
        </div>
        <div class="loot-info">
          <div class="loot-name">${item.name}</div>
          <div class="loot-meta">
            <span class="rarity rarity-${item.rarity.toLowerCase()}">${item.rarity}</span>
            <span class="loot-type">${item.item_type}</span>
          </div>
          <div class="loot-sources">${sources}</div>
        </div>
        <div style="color:var(--muted);font-size:1rem;padding-left:4px;flex-shrink:0">›</div>
      </div>`;
  }

  // Search
  const searchEl = document.getElementById('search');
  searchEl.addEventListener('input', () => render(searchEl.value));

  // Rarity filter
  document.getElementById('controls').addEventListener('click', e => {
    const btn = e.target.closest('[data-rarity]');
    if (!btn) return;
    activeRarity = btn.dataset.rarity;
    document.querySelectorAll('[data-rarity]').forEach(b => b.classList.toggle('active', b === btn));
    render(searchEl.value);
  });

  // Filter by arc if ?arc= param present
  const arcParam = new URLSearchParams(location.search).get('arc');
  if (arcParam && ARC_NAMES[arcParam]) {
    allItems = allItems.filter(item => item.sources.includes(arcParam));
    const label = document.createElement('div');
    label.style.cssText = 'padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--border);font-size:0.82rem;color:var(--muted);display:flex;align-items:center;gap:10px';
    label.innerHTML = `Showing drops for <strong style="color:var(--text)">${ARC_NAMES[arcParam]}</strong>
      <a href="loot.html" style="color:var(--accent);font-size:0.75rem;text-decoration:none;border:1px solid var(--accent);border-radius:4px;padding:2px 8px">Show all</a>`;
    document.getElementById('controls').insertAdjacentElement('afterend', label);
  }

  render();

  // ── ITEM DETAIL MODAL ─────────────────────────────────────────────────────

  const PROXY = 'https://corsproxy.io/?url=';
  const ITEM_API_ENDPOINTS = [
    id => `https://metaforge.app/api/arc-raiders/items/${id}`,
    id => `https://metaforge.app/api/arc-raiders/item/${id}`,
  ];

  function nameToSlug(name) {
    return name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  }

  let activeTab = 'used_in';
  let detailCache = {};

  function openItemModal(item) {
    const overlay = document.getElementById('itemModalOverlay');
    document.getElementById('iModalIcon').src  = item.icon || '';
    document.getElementById('iModalIcon').alt  = item.name;
    document.getElementById('iModalTitle').textContent = item.name;
    document.getElementById('iModalSub').innerHTML =
      `<span class="rarity rarity-${item.rarity.toLowerCase()}">${item.rarity}</span>` +
      `<span>${item.item_type}</span>`;

    // Reset tabs to loading state
    ['used_in','dropped_by','recycles_into','recycled_from'].forEach(t => {
      document.getElementById(`tab-${t}`).querySelector('.tab-count').textContent = '';
      document.getElementById(`panel-${t}`).innerHTML =
        '<div class="detail-loading"><div class="detail-spinner"></div>Loading…</div>';
    });
    setActiveTab('used_in');
    overlay.classList.add('open');
    document.body.style.overflow = 'hidden';

    fetchItemDetail(item);
  }

  async function fetchItemDetail(item) {
    const slug = nameToSlug(item.name);
    if (detailCache[slug]) { populateModal(detailCache[slug]); return; }

    for (const endpointFn of ITEM_API_ENDPOINTS) {
      try {
        const res  = await fetch(PROXY + encodeURIComponent(endpointFn(slug)));
        if (!res.ok) continue;
        const json = await res.json();
        const data = json.data ?? json;
        detailCache[slug] = data;
        populateModal(data);
        return;
      } catch (_) {}
    }
    // All failed
    ['used_in','dropped_by','recycles_into','recycled_from'].forEach(t => {
      document.getElementById(`panel-${t}`).innerHTML =
        '<div class="detail-empty">No data available.</div>';
    });
  }

  function populateModal(data) {
    const sections = {
      used_in:       data.used_in        || data.usedIn        || data.crafting_uses || [],
      dropped_by:    data.dropped_by     || data.droppedBy     || data.sources       || [],
      recycles_into: data.recycles_into  || data.recyclesInto  || data.recycle_into  || [],
      recycled_from: data.recycled_from  || data.recycledFrom  || data.recycle_from  || [],
    };

    Object.entries(sections).forEach(([key, rows]) => {
      const tab   = document.getElementById(`tab-${key}`);
      const panel = document.getElementById(`panel-${key}`);
      tab.querySelector('.tab-count').textContent = rows.length || '';

      if (!Array.isArray(rows) || !rows.length) {
        panel.innerHTML = '<div class="detail-empty">None listed.</div>';
        return;
      }

      const isDroppedBy = key === 'dropped_by';
      panel.innerHTML = `
        <table class="detail-table">
          <thead><tr>
            ${isDroppedBy ? '' : '<th>Qty</th>'}
            <th>Name</th>
            <th>Type</th>
          </tr></thead>
          <tbody>
            ${rows.map(r => {
              const name = r.name || r.item_name || r.arc_name || r.id || '—';
              const type = r.type || r.item_type || r.category || '—';
              const qty  = r.quantity || r.qty || r.count || '';
              const icon = r.icon || r.image || '';
              return `<tr>
                ${isDroppedBy ? '' : `<td style="color:var(--muted);font-size:0.8rem;width:36px">${qty}</td>`}
                <td>
                  ${icon ? `<img class="detail-img" src="${icon}" onerror="this.style.display='none'">` : ''}
                  ${name}
                </td>
                <td style="color:var(--muted);font-size:0.78rem">${type}</td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>`;
    });
  }

  function setActiveTab(tabKey) {
    activeTab = tabKey;
    document.querySelectorAll('.item-tab').forEach(t =>
      t.classList.toggle('active', t.dataset.tab === tabKey));
    document.querySelectorAll('.tab-panel').forEach(p =>
      p.classList.toggle('active', p.id === `panel-${tabKey}`));
  }

  function closeItemModal() {
    document.getElementById('itemModalOverlay').classList.remove('open');
    document.body.style.overflow = '';
  }

  // Event delegation — catch clicks on loot rows
  document.getElementById('main').addEventListener('click', e => {
    const row = e.target.closest('.loot-item');
    if (!row) return;
    const name = row.dataset.name;
    // Find item in built index
    const item = allItems.find(i => i.name === name);
    if (item) openItemModal(item);
  });

  document.getElementById('itemModalOverlay').addEventListener('click', e => {
    if (e.target === document.getElementById('itemModalOverlay')) closeItemModal();
  });
  document.querySelectorAll('.item-tab').forEach(t =>
    t.addEventListener('click', () => setActiveTab(t.dataset.tab)));
</script>

          <div class="item-modal-title" id="iModalTitle"></div>
          <div class="item-modal-sub" id="iModalSub"></div>
        </div>

      <div class="tab-panel" id="panel-recycled_from"></div>

    <button class="item-modal-close" onclick="closeItemModal()">Close</button>
