<html lang="en">
<head>
  <meta charset="UTF-8" />

  <title>Arc Raiders – Loot</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0d0f14;
      --surface:  #141720;
      --surface2: #1c2030;
      --border:   #2a2f42;
      --accent:   #e8a020;
      --text:     #e2e8f0;
      --muted:    #6b7280;
      --danger:   #ef4444;
    }

    body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    /* ── HEADER ── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo { display: flex; align-items: center; gap: 10px; }
    .logo svg { color: var(--accent); }
    .logo h1 { font-size: 1.1rem; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; }
    .logo h1 span { color: var(--accent); }

    nav { display: flex; gap: 6px; flex-wrap: wrap; }
    .nav-link {
      padding: 8px 14px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      font-size: 0.82rem;
      text-decoration: none;
      transition: all 0.15s;
    }
    .nav-link:hover { border-color: var(--accent); color: var(--accent); }
    .nav-link.active { background: var(--accent); border-color: var(--accent); color: #000; font-weight: 600; }

    /* ── CONTROLS ── */
    #controls {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    #search {
      flex: 1;
      min-width: 200px;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 0.9rem;
      outline: none;
    }
    #search:focus { border-color: var(--accent); }
    #search::placeholder { color: var(--muted); }

    .filter-btn {
      padding: 8px 14px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .filter-btn:hover { border-color: var(--accent); color: var(--accent); }
    .filter-btn.active { background: var(--accent); border-color: var(--accent); color: #000; font-weight: 600; }

    /* ── MAIN ── */
    main { padding: 20px; max-width: 900px; margin: 0 auto; }

    /* ── LOOT ITEM ROW ── */
    .loot-item {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 10px;
    }

    .loot-icon {
      width: 48px;
      height: 48px;
      border-radius: 8px;
      background: var(--surface);
      flex-shrink: 0;
      overflow: hidden;
    }
    .loot-icon img { width: 100%; height: 100%; object-fit: contain; }

    .loot-info { flex: 1; min-width: 0; }

    .loot-name {
      font-size: 0.95rem;
      font-weight: 600;
    }

    .loot-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 5px;
      flex-wrap: wrap;
    }

    .loot-type {
      font-size: 0.72rem;
      color: var(--muted);
    }

    .loot-sources {
      margin-top: 6px;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .source-tag {
      font-size: 0.7rem;
      padding: 3px 8px;
      border-radius: 4px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
    }

    /* ── RARITY BADGES ── */
    .rarity {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.7rem;
      font-weight: 700;
    }
    .rarity-common    { background: #374151; color: #9ca3af; }
    .rarity-uncommon  { background: #14532d; color: #4ade80; }
    .rarity-rare      { background: #1e3a8a; color: #60a5fa; }
    .rarity-epic      { background: #4a1d96; color: #c084fc; }
    .rarity-legendary { background: #78350f; color: var(--accent); }

    /* ── RARITY GROUP HEADER ── */
    .rarity-group-title {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 20px 0 10px;
    }

    /* ── EMPTY ── */
    .empty { text-align: center; padding: 48px; color: var(--muted); font-size: 0.9rem; }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  </style>
</head>

      { name: 'Vita Shot Blueprint',               rarity: 'Legendary', item_type: 'Blueprint',        icon: CDN+'vita-shot.webp' },
      { name: 'Surveyor Vault',                    rarity: 'Rare',      item_type: 'Recyclable',       icon: CDN+'surveyor-vault.webp' },
      { name: 'ARC Motion Core',                   rarity: 'Rare',      item_type: 'Topside Material', icon: CDN+'arc-motion-core.webp' },
      { name: 'ARC Circuitry',                     rarity: 'Rare',      item_type: 'Topside Material', icon: CDN+'arc-circuitry.webp' },
      { name: 'Advanced ARC Powercell',            rarity: 'Rare',      item_type: 'Topside Material', icon: CDN+'advanced-arc-powercell.webp' },
      { name: 'Sensors',                           rarity: 'Rare',      item_type: 'Topside Material', icon: CDN+'sensors-recipe.webp' },
      { name: 'ARC Alloy',                         rarity: 'Uncommon',  item_type: 'Topside Material', icon: CDN+'arc-alloy.webp' },
      { name: 'ARC Powercell',                     rarity: 'Common',    item_type: 'Topside Material', icon: CDN+'arc-powercell.webp' },
    ],
    'tick': [
      { name: 'Tick Pod',  rarity: 'Uncommon', item_type: 'Recyclable',       icon: CDN+'tick-pod.webp' },
      { name: 'ARC Alloy', rarity: 'Uncommon', item_type: 'Topside Material', icon: CDN+'arc-alloy.webp' },
    ],
    'turret': [
      { name: 'ARC Alloy',        rarity: 'Uncommon', item_type: 'Topside Material', icon: CDN+'arc-alloy.webp' },
      { name: 'Simple Gun Parts', rarity: 'Uncommon', item_type: 'Topside Material', icon: CDN+'simple-gun-parts.webp' },
      { name: 'Light Ammo',       rarity: 'Common',   item_type: 'Ammunition',       icon: CDN+'light-ammo.webp' },
    ],
    'wasp': [
      { name: 'Wasp Driver',   rarity: 'Rare',     item_type: 'Recyclable',       icon: CDN+'wasp-driver.webp' },
      { name: 'ARC Alloy',    rarity: 'Uncommon', item_type: 'Topside Material', icon: CDN+'arc-alloy.webp' },
      { name: 'ARC Powercell',rarity: 'Common',   item_type: 'Topside Material', icon: CDN+'arc-powercell.webp' },
      { name: 'Light Ammo',   rarity: 'Common',   item_type: 'Ammunition',       icon: CDN+'light-ammo.webp' },
    ],
  };

  const RARITY_ORDER = { Legendary: 0, Epic: 1, Rare: 2, Uncommon: 3, Common: 4 };

  // Build inverted index: item name → { icon, rarity, item_type, sources: [arcId...] }
  function buildIndex() {
    const index = new Map();
    for (const [arcId, items] of Object.entries(LOOT)) {
      for (const item of items) {
        if (!index.has(item.name)) {
          index.set(item.name, { ...item, sources: [] });
        }
        index.get(item.name).sources.push(arcId);
      }
    }
    return [...index.values()].sort((a, b) =>
      (RARITY_ORDER[a.rarity] ?? 9) - (RARITY_ORDER[b.rarity] ?? 9) || a.name.localeCompare(b.name)
    );
  }

  let allItems = buildIndex();
  let activeRarity = 'all';

  function render(query = '') {
    const q = query.toLowerCase();
    const items = allItems.filter(item =>
      (activeRarity === 'all' || item.rarity === activeRarity) &&
      (!q || item.name.toLowerCase().includes(q) || item.item_type.toLowerCase().includes(q))
    );

    const main = document.getElementById('main');
    if (!items.length) {
      main.innerHTML = '<div class="empty">No items found.</div>';
      return;
    }

    // Group by rarity when showing all
    if (activeRarity === 'all') {
      const groups = {};
      for (const item of items) {
        if (!groups[item.rarity]) groups[item.rarity] = [];
        groups[item.rarity].push(item);
      }
      main.innerHTML = Object.entries(RARITY_ORDER)
        .filter(([r]) => groups[r])
        .map(([r]) => `
          <div class="rarity-group-title">${r}</div>
          ${groups[r].map(renderItem).join('')}
        `).join('');
    } else {
      main.innerHTML = items.map(renderItem).join('');
    }
  }

  function renderItem(item) {
    const sources = item.sources.map(id =>
      `<span class="source-tag">${ARC_NAMES[id] ?? id}</span>`
    ).join('');
    return `
      <div class="loot-item">
        <div class="loot-icon">
          <img src="${item.icon}" alt="${item.name}" loading="lazy" onerror="this.style.display='none'">
        </div>
        <div class="loot-info">
          <div class="loot-name">${item.name}</div>
          <div class="loot-meta">
            <span class="rarity rarity-${item.rarity.toLowerCase()}">${item.rarity}</span>
            <span class="loot-type">${item.item_type}</span>
          </div>
          <div class="loot-sources">${sources}</div>
        </div>
      </div>`;
  }

  // Search
  const searchEl = document.getElementById('search');
  searchEl.addEventListener('input', () => render(searchEl.value));

  // Rarity filter
  document.getElementById('controls').addEventListener('click', e => {
    const btn = e.target.closest('[data-rarity]');
    if (!btn) return;
    activeRarity = btn.dataset.rarity;
    document.querySelectorAll('[data-rarity]').forEach(b => b.classList.toggle('active', b === btn));
    render(searchEl.value);
  });

  render();
</script>
</body>
</html>
