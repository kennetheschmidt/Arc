<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Map &amp; Locations – Arc Raiders</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0d0f14;
      --surface:  #141720;
      --surface2: #1c2030;
      --border:   #2a2f42;
      --accent:   #e8a020;
      --red:      #e8423a;
      --text:     #e2e8f0;
      --muted:    #6b7280;
      --rare:     #a78bfa;
      --uncommon: #4ade80;
      --common:   #9ca3af;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── NAV ── */
    nav {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 20px;
      display: flex;
      align-items: center;
      gap: 4px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      flex-shrink: 0;
    }
    nav::-webkit-scrollbar { display: none; }
    nav a {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.78rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 14px 12px;
      white-space: nowrap;
      border-bottom: 2px solid transparent;
      transition: color 0.15s, border-color 0.15s;
    }
    nav a:hover { color: var(--text); }
    nav a.active { color: var(--accent); border-bottom-color: var(--accent); }

    /* ── PAGE HEADER ── */
    .page-header {
      padding: 28px 24px 0;
      max-width: 960px;
      margin: 0 auto;
      width: 100%;
    }
    .page-header h1 {
      font-size: 1.4rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text);
    }
    .page-header p {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 4px;
    }

    /* ── CONTROLS ── */
    .controls {
      padding: 16px 24px;
      max-width: 960px;
      margin: 0 auto;
      width: 100%;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }
    .search-box {
      flex: 1;
      min-width: 180px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 14px;
      color: var(--text);
      font-size: 0.88rem;
    }
    .search-box:focus { outline: none; border-color: var(--accent); }
    .search-box::placeholder { color: var(--muted); }

    .map-tabs {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .map-tab {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.15s;
    }
    .map-tab:hover { color: var(--text); border-color: var(--text); }
    .map-tab.active { background: var(--accent); border-color: var(--accent); color: #000; }

    /* ── MAIN CONTENT ── */
    .content {
      flex: 1;
      padding: 0 24px 52px;
      max-width: 960px;
      margin: 0 auto;
      width: 100%;
    }

    /* ── STATUS ── */
    .status {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
      font-size: 0.9rem;
    }
    .spinner {
      width: 32px; height: 32px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── POI GRID ── */
    .poi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 14px;
    }

    .poi-card {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      transition: border-color 0.15s, transform 0.15s;
      cursor: pointer;
    }
    .poi-card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }
    .poi-card-header {
      padding: 14px 16px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }
    .poi-name {
      font-size: 0.92rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .poi-type {
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 3px 8px;
      border-radius: 4px;
      background: var(--surface);
      color: var(--muted);
      white-space: nowrap;
      flex-shrink: 0;
    }
    .poi-loot-preview {
      padding: 0 16px 14px;
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }
    .loot-chip {
      font-size: 0.68rem;
      padding: 2px 7px;
      border-radius: 4px;
      font-weight: 600;
    }
    .loot-chip.rare     { background: rgba(167,139,250,0.15); color: var(--rare); }
    .loot-chip.uncommon { background: rgba(74,222,128,0.12); color: var(--uncommon); }
    .loot-chip.common   { background: rgba(156,163,175,0.12); color: var(--common); }
    .loot-chip.epic     { background: rgba(232,160,32,0.15); color: var(--accent); }
    .loot-more {
      font-size: 0.68rem;
      color: var(--muted);
      padding: 2px 4px;
      align-self: center;
    }

    /* ── DEBUG PANEL ── */
    .debug-panel {
      margin-top: 32px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }
    .debug-toggle {
      width: 100%;
      background: none;
      border: none;
      color: var(--muted);
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 12px 16px;
      text-align: left;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .debug-toggle:hover { color: var(--text); }
    .debug-body {
      display: none;
      padding: 16px;
      border-top: 1px solid var(--border);
    }
    .debug-body.open { display: block; }
    .debug-body pre {
      font-size: 0.72rem;
      color: var(--muted);
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 400px;
      overflow-y: auto;
    }

    /* ── MODAL ── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      z-index: 100;
      align-items: flex-end;
      justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px 16px 0 0;
      padding: 24px;
      width: 100%;
      max-width: 600px;
      max-height: 80vh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .modal-title {
      font-size: 1.1rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      margin-bottom: 6px;
    }
    .modal-meta {
      font-size: 0.78rem;
      color: var(--muted);
      margin-bottom: 18px;
    }
    .loot-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
    }
    .loot-table th {
      text-align: left;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      padding: 0 0 8px;
      border-bottom: 1px solid var(--border);
    }
    .loot-table td {
      padding: 8px 0;
      border-bottom: 1px solid rgba(42,47,66,0.5);
      vertical-align: middle;
    }
    .loot-table tr:last-child td { border-bottom: none; }
    .item-icon {
      width: 28px; height: 28px;
      border-radius: 4px;
      background: var(--surface2);
      object-fit: contain;
      margin-right: 8px;
      vertical-align: middle;
    }
    .rarity-dot {
      display: inline-block;
      width: 8px; height: 8px;
      border-radius: 50%;
      margin-right: 6px;
    }
    .modal-close {
      position: sticky;
      bottom: 0;
      width: 100%;
      margin-top: 20px;
      padding: 12px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>

<nav>
  <a href="index.html">Home</a>
  <a href="events.html">Events</a>
  <a href="arcs.html">ARC Units</a>
  <a href="loot.html">Loot</a>
  <a href="traders.html">Traders</a>
  <a href="map.html" class="active">Map</a>
</nav>

<div class="page-header">
  <h1>Map &amp; Locations</h1>
  <p>Points of interest and loot locations by map</p>
</div>

<div class="controls">
  <input class="search-box" type="search" id="search" placeholder="Search locations…" />
  <div class="map-tabs" id="mapTabs"></div>
</div>

<div class="content">
  <div class="status" id="status">
    <div class="spinner"></div>
    Loading map data…
  </div>
  <div class="poi-grid" id="poiGrid" style="display:none"></div>
  <div class="debug-panel" id="debugPanel" style="display:none">
    <button class="debug-toggle" onclick="toggleDebug()">
      <span>Raw API Response</span><span id="debugArrow">▶</span>
    </button>
    <div class="debug-body" id="debugBody">
      <pre id="debugPre"></pre>
    </div>
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal" id="modal">
    <div class="modal-title" id="modalTitle"></div>
    <div class="modal-meta" id="modalMeta"></div>
    <table class="loot-table" id="modalTable">
      <thead><tr><th>Item</th><th>Rarity</th><th>Type</th></tr></thead>
      <tbody id="modalBody"></tbody>
    </table>
    <button class="modal-close" onclick="document.getElementById('modalOverlay').classList.remove('open')">Close</button>
  </div>
</div>

<script>
const PROXY   = 'https://corsproxy.io/?url=';
const BASE    = 'https://metaforge.app/api/game-map-data';
const TABLE   = 'arc_map_data';
const MAP_IDS = ['dam', 'spaceport', 'buried-city', 'blue-gate'];
const MAP_LABELS = {
  'dam':         'Dam',
  'spaceport':   'Spaceport',
  'buried-city': 'Buried City',
  'blue-gate':   'Blue Gate',
};

const RARITY_COLOR = {
  common:    '#9ca3af',
  uncommon:  '#4ade80',
  rare:      '#a78bfa',
  epic:      '#e8a020',
  legendary: '#e8423a',
};

let allPois = [];
let currentMap = 'all';
let rawDebug = {};

// ── FETCH ──────────────────────────────────────────────────────────────────

async function loadData() {
  try {
    const results = await Promise.all(MAP_IDS.map(async mapID => {
      const url = `${BASE}?tableID=${TABLE}&mapID=${mapID}`;
      const res = await fetch(PROXY + encodeURIComponent(url));
      const json = await res.json();
      rawDebug[mapID] = json;
      // Shape: { "buried-city": { "allData": [...] } }
      const mapData = json[mapID] || json;
      const items = mapData.allData || mapData.data || (Array.isArray(mapData) ? mapData : []);
      return { mapID, mapLabel: MAP_LABELS[mapID] || mapID, items };
    }));

    document.getElementById('debugPre').textContent = JSON.stringify(rawDebug, null, 2);
    document.getElementById('debugPanel').style.display = '';

    const maps = results.filter(r => r.items.length > 0);
    if (!maps.length) {
      setStatus('No map data returned — see Raw API Response below.');
      return;
    }
    processData(maps);
  } catch (e) {
    setStatus('Failed to load map data: ' + e.message);
  }
}

// ── PROCESS ────────────────────────────────────────────────────────────────

function processData(maps) {
  allPois = maps.flatMap(m =>
    m.items.map(p => normalisePoi(p, m.mapLabel))
  );
  buildMapTabs(maps);
  renderPois();
}

function normalisePoi(p, mapLabel) {
  return {
    id:          p.id || Math.random().toString(36).slice(2),
    name:        p.instanceName || p.name || p.title || 'Unknown',
    category:    p.category || '',
    subcategory: p.subcategory || '',
    map:         mapLabel,
    locked:      p.behindLockedDoor || false,
    loot:        normaliseLoot(p.lootAreas || p.loot || p.items || []),
    coords:      (p.lat !== undefined) ? {x: p.lng, y: p.lat} : null,
    raw:         p,
  };
}

function normaliseLoot(loot) {
  if (!Array.isArray(loot)) return [];
  return loot.map(item => {
    if (typeof item === 'string') return { name: item, rarity: 'common', type: '' };
    return {
      id:     item.id || item.item_id || '',
      name:   item.name || item.item_name || item.id || 'Unknown',
      rarity: (item.rarity || item.tier || 'common').toLowerCase(),
      type:   item.type || item.item_type || item.category || '',
      icon:   item.icon || item.image || item.img || null,
    };
  });
}

// ── TABS ───────────────────────────────────────────────────────────────────

function buildMapTabs(maps) {
  const tabsEl = document.getElementById('mapTabs');
  const all = document.createElement('button');
  all.className = 'map-tab active';
  all.textContent = 'All Maps';
  all.dataset.map = 'all';
  all.addEventListener('click', () => selectMap('all', all));
  tabsEl.appendChild(all);

  maps.forEach(m => {
    const label = m.mapLabel || m.name;
    const btn = document.createElement('button');
    btn.className = 'map-tab';
    btn.textContent = label;
    btn.dataset.map = label;
    btn.addEventListener('click', () => selectMap(label, btn));
    tabsEl.appendChild(btn);
  });
}

function selectMap(name, el) {
  currentMap = name;
  document.querySelectorAll('.map-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  renderPois();
}

// ── RENDER ─────────────────────────────────────────────────────────────────

function renderPois() {
  const query   = document.getElementById('search').value.toLowerCase();
  const grid    = document.getElementById('poiGrid');
  const status  = document.getElementById('status');

  let filtered = allPois;
  if (currentMap !== 'all') filtered = filtered.filter(p => p.map === currentMap);
  if (query) filtered = filtered.filter(p =>
    p.name.toLowerCase().includes(query) ||
    p.category.toLowerCase().includes(query) ||
    p.subcategory.toLowerCase().includes(query) ||
    p.loot.some(l => l.name.toLowerCase().includes(query))
  );

  status.style.display  = 'none';
  grid.style.display    = '';

  if (!filtered.length) {
    grid.innerHTML = '<div style="color:var(--muted);font-size:0.85rem;padding:20px 0">No locations found.</div>';
    return;
  }

  grid.innerHTML = '';
  filtered.forEach(poi => {
    const card = document.createElement('div');
    card.className = 'poi-card';
    const subLabel = poi.subcategory
      ? poi.category + (poi.subcategory !== poi.category ? ' · ' + poi.subcategory : '')
      : poi.category;
    card.innerHTML = `
      <div class="poi-card-header">
        <div class="poi-name">${esc(poi.name)}</div>
        <div class="poi-type">${esc(subLabel)}${poi.locked ? ' 🔒' : ''}</div>
      </div>
      <div class="poi-loot-preview"></div>
    `;
    const preview = card.querySelector('.poi-loot-preview');
    if (poi.loot.length) {
      poi.loot.slice(0, 5).forEach(l => {
        const chip = document.createElement('span');
        chip.className = `loot-chip ${l.rarity}`;
        chip.textContent = l.name;
        preview.appendChild(chip);
      });
      if (poi.loot.length > 5) {
        const more = document.createElement('span');
        more.className = 'loot-more';
        more.textContent = `+${poi.loot.length - 5} more`;
        preview.appendChild(more);
      }
    } else {
      preview.innerHTML = `<span style="font-size:0.72rem;color:var(--muted)">${esc(poi.map)}</span>`;
    }
    card.addEventListener('click', () => openModal(poi));
    grid.appendChild(card);
  });
}

// ── MODAL ──────────────────────────────────────────────────────────────────

function openModal(poi) {
  document.getElementById('modalTitle').textContent = poi.name;
  document.getElementById('modalMeta').textContent =
    [poi.map, poi.category, poi.subcategory].filter(Boolean).join(' · ') +
    (poi.locked ? ' · Behind Locked Door' : '') +
    (poi.coords ? ` · (${Math.round(poi.coords.x)}, ${Math.round(poi.coords.y)})` : '');

  const tbody = document.getElementById('modalBody');
  tbody.innerHTML = '';

  if (!poi.loot.length) {
    tbody.innerHTML = '<tr><td colspan="3" style="color:var(--muted);padding:12px 0">No loot data for this location.</td></tr>';
  } else {
    poi.loot.forEach(l => {
      const color = RARITY_COLOR[l.rarity] || RARITY_COLOR.common;
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>
          ${l.icon ? `<img class="item-icon" src="${esc(l.icon)}" alt="" onerror="this.style.display='none'">` : ''}
          ${esc(l.name)}
        </td>
        <td>
          <span class="rarity-dot" style="background:${color}"></span>
          <span style="color:${color};font-size:0.78rem;text-transform:capitalize">${esc(l.rarity)}</span>
        </td>
        <td style="color:var(--muted);font-size:0.78rem">${esc(l.type)}</td>
      `;
      tbody.appendChild(tr);
    });
  }

  document.getElementById('modalOverlay').classList.add('open');
}

function closeModal(e) {
  if (e.target === document.getElementById('modalOverlay'))
    document.getElementById('modalOverlay').classList.remove('open');
}

// ── DEBUG ──────────────────────────────────────────────────────────────────

function toggleDebug() {
  const body  = document.getElementById('debugBody');
  const arrow = document.getElementById('debugArrow');
  body.classList.toggle('open');
  arrow.textContent = body.classList.contains('open') ? '▼' : '▶';
}

// ── HELPERS ────────────────────────────────────────────────────────────────

function setStatus(msg) {
  const el = document.getElementById('status');
  el.innerHTML = `<div style="color:var(--red)">${msg}</div>`;
  el.style.display = '';
}

function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

document.getElementById('search').addEventListener('input', renderPois);

loadData();
</script>
</body>
</html>
