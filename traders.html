<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arc Raiders – Traders</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0d0f14;
      --surface:  #141720;
      --surface2: #1c2030;
      --border:   #2a2f42;
      --accent:   #e8a020;
      --text:     #e2e8f0;
      --muted:    #6b7280;
      --danger:   #ef4444;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── HEADER ── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo { display: flex; align-items: center; gap: 12px; }
    .logo svg { color: var(--accent); }
    .logo h1 { font-size: 1.25rem; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; }
    .logo h1 span { color: var(--accent); }

    nav { display: flex; gap: 6px; flex-wrap: wrap; }

    .nav-link {
      padding: 6px 14px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      font-size: 0.82rem;
      text-decoration: none;
      transition: all 0.15s;
    }
    .nav-link:hover { border-color: var(--accent); color: var(--accent); }
    .nav-link.active { background: var(--accent); border-color: var(--accent); color: #000; font-weight: 600; }

    /* ── SEARCH ── */
    #search-bar {
      padding: 12px 24px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    #search {
      width: 100%;
      max-width: 400px;
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 0.88rem;
      outline: none;
      transition: border-color 0.15s;
    }
    #search:focus { border-color: var(--accent); }
    #search::placeholder { color: var(--muted); }

    /* ── MAIN ── */
    main { padding: 24px; max-width: 1200px; margin: 0 auto; }

    #trader-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }

    /* ── TRADER CARD ── */
    .trader-card {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      transition: border-color 0.15s, transform 0.15s;
    }
    .trader-card:hover { border-color: var(--accent); transform: translateY(-2px); }

    .trader-image {
      width: 100%;
      height: 180px;
      object-fit: cover;
      object-position: top;
      display: block;
      background: var(--surface);
    }

    .trader-card-body {
      padding: 14px;
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    .trader-icon {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      background: var(--surface);
      flex-shrink: 0;
      overflow: hidden;
    }
    .trader-icon img { width: 100%; height: 100%; object-fit: contain; }

    .trader-info { min-width: 0; }
    .trader-name { font-size: 0.95rem; font-weight: 700; color: var(--text); }
    .trader-subtitle {
      font-size: 0.72rem;
      color: var(--accent);
      font-weight: 600;
      margin-top: 2px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .trader-desc {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 4px;
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* ── MODAL ── */
    #modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 200;
      padding: 16px;
      align-items: center;
      justify-content: center;
    }
    #modal-backdrop.open { display: flex; }

    #modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      width: 100%;
      max-width: 680px;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #modal-image {
      width: 100%;
      height: 160px;
      object-fit: cover;
      object-position: top;
      display: block;
      flex-shrink: 0;
      background: var(--bg);
    }

    #modal-body {
      padding: 20px;
      overflow-y: auto;
      flex: 1;
      -webkit-overflow-scrolling: touch;
    }

    .modal-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 16px;
    }

    .modal-icon {
      width: 52px;
      height: 52px;
      border-radius: 10px;
      background: var(--bg);
      overflow: hidden;
      flex-shrink: 0;
    }
    .modal-icon img { width: 100%; height: 100%; object-fit: contain; }

    .modal-name-wrap { min-width: 0; }
    #modal-name { font-size: 1.3rem; font-weight: 700; }
    #modal-subtitle { font-size: 0.72rem; color: var(--accent); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; margin-top: 2px; }

    .modal-section { margin-top: 16px; }

    .modal-section-title {
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 8px;
    }

    #modal-description {
      font-size: 0.85rem;
      color: var(--muted);
      line-height: 1.7;
      white-space: pre-wrap;
    }

    /* ── DETAIL ROWS ── */
    .detail-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .detail-item {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
    }
    .detail-label {
      font-size: 0.67rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .detail-value {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text);
    }

    .modal-close {
      float: right;
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
      padding: 0 0 4px 8px;
    }
    .modal-close:hover { color: var(--text); }

    /* ── LOADING / ERROR ── */
    #status {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
      font-size: 0.9rem;
    }
    #status .spinner {
      width: 32px; height: 32px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #status.error { color: var(--danger); }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="none"
         viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round"
            d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.3 2.3c-.6.6-.2 1.7.7 1.7H17m0 0a2 2 0 100 4 2 2 0 000-4zm-10 2a2 2 0 100 4 2 2 0 000-4z"/>
    </svg>
    <h1>Arc Raiders <span>Traders</span></h1>
  </div>
  <nav>
    <a href="index.html"   class="nav-link">Events</a>
    <a href="arcs.html"    class="nav-link">ARC Units</a>
    <a href="loot.html"    class="nav-link">Loot</a>
    <a href="traders.html" class="nav-link active">Traders</a>
  </nav>
</header>

<div id="search-bar">
  <input id="search" type="search" placeholder="Search traders…" autocomplete="off" />
</div>

<main>
  <div id="status"><div class="spinner"></div>Loading traders…</div>
  <div id="trader-grid" style="display:none"></div>
</main>

<!-- MODAL -->
<div id="modal-backdrop">
  <div id="modal">
    <img id="modal-image" src="" alt="" onerror="this.style.display='none'" />
    <div id="modal-body">
      <button class="modal-close" id="modal-close">&#x2715;</button>
      <div class="modal-header">
        <div class="modal-icon"><img id="modal-icon" src="" alt="" onerror="this.parentElement.style.display='none'" /></div>
        <div class="modal-name-wrap">
          <div id="modal-name"></div>
          <div id="modal-subtitle"></div>
        </div>
      </div>
      <div class="modal-section" id="modal-details-section" style="display:none">
        <div class="modal-section-title">Details</div>
        <div class="detail-grid" id="modal-details"></div>
      </div>
      <div class="modal-section">
        <div class="modal-section-title">Description</div>
        <div id="modal-description"></div>
      </div>
    </div>
  </div>
</div>

<footer style="text-align:center;padding:24px;margin-top:32px;border-top:1px solid var(--border);font-size:0.78rem;color:var(--muted)">
  Data provided by <a href="https://metaforge.app/arc-raiders" target="_blank" rel="noopener"
  style="color:var(--accent);text-decoration:none">metaforge.app</a>
</footer>

<script>
  const PROXY_URL = 'https://corsproxy.io/?url=https://metaforge.app/api/arc-raiders/traders';

  let allTraders = [];

  // iOS Safari scroll lock
  function lockScroll() {
    const y = window.scrollY;
    document.body.style.position = 'fixed';
    document.body.style.top = `-${y}px`;
    document.body.style.width = '100%';
    document.body.dataset.scrollY = y;
  }
  function unlockScroll() {
    const y = parseInt(document.body.dataset.scrollY || '0');
    document.body.style.position = '';
    document.body.style.top = '';
    document.body.style.width = '';
    window.scrollTo(0, y);
  }

  // Pick the best available image/icon from a trader object
  function getImage(t) {
    return t.image || t.portrait || t.banner || t.splash || '';
  }
  function getIcon(t) {
    return t.icon || t.avatar || t.thumbnail || '';
  }
  function getSubtitle(t) {
    return t.role || t.faction || t.type || t.category || t.occupation || '';
  }
  function getDescription(t) {
    return t.description || t.bio || t.lore || t.flavor || 'No description available.';
  }

  // Collect extra key/value fields worth showing in the detail grid
  const SKIP_KEYS = new Set(['id','name','description','bio','lore','flavor','image','portrait',
    'banner','splash','icon','avatar','thumbnail','role','faction','type','category','occupation']);

  function getDetails(t) {
    return Object.entries(t)
      .filter(([k, v]) => !SKIP_KEYS.has(k) && v !== null && v !== undefined && v !== '' && typeof v !== 'object')
      .map(([k, v]) => ({ label: k.replace(/_/g, ' '), value: String(v) }));
  }

  function renderGrid(traders) {
    const grid = document.getElementById('trader-grid');
    grid.innerHTML = '';
    if (!traders.length) {
      grid.innerHTML = '<p style="color:var(--muted);font-size:0.85rem">No traders found.</p>';
      return;
    }
    traders.forEach(trader => {
      const card = document.createElement('div');
      card.className = 'trader-card';
      const img   = getImage(trader);
      const icon  = getIcon(trader);
      const sub   = getSubtitle(trader);
      const desc  = getDescription(trader);
      card.innerHTML = `
        <img class="trader-image" src="${img}" alt="${trader.name}"
             onerror="this.style.display='none'" loading="lazy" />
        <div class="trader-card-body">
          <div class="trader-icon">
            <img src="${icon}" alt="" onerror="this.parentElement.style.display='none'" loading="lazy" />
          </div>
          <div class="trader-info">
            <div class="trader-name">${trader.name}</div>
            ${sub ? `<div class="trader-subtitle">${sub}</div>` : ''}
            <div class="trader-desc">${desc}</div>
          </div>
        </div>`;
      card.addEventListener('click', () => openModal(trader));
      grid.appendChild(card);
    });
  }

  function openModal(trader) {
    lockScroll();
    const img  = getImage(trader);
    const icon = getIcon(trader);
    const sub  = getSubtitle(trader);

    const modalImg = document.getElementById('modal-image');
    modalImg.src = img;
    modalImg.alt = trader.name;
    modalImg.style.display = img ? '' : 'none';

    const modalIcon = document.getElementById('modal-icon');
    modalIcon.src = icon;
    modalIcon.parentElement.style.display = icon ? '' : 'none';

    document.getElementById('modal-name').textContent = trader.name;
    document.getElementById('modal-subtitle').textContent = sub;
    document.getElementById('modal-subtitle').style.display = sub ? '' : 'none';
    document.getElementById('modal-description').textContent = getDescription(trader);

    const details = getDetails(trader);
    const detailsSection = document.getElementById('modal-details-section');
    if (details.length) {
      document.getElementById('modal-details').innerHTML = details.map(d => `
        <div class="detail-item">
          <div class="detail-label">${d.label}</div>
          <div class="detail-value">${d.value}</div>
        </div>`).join('');
      detailsSection.style.display = '';
    } else {
      detailsSection.style.display = 'none';
    }

    document.getElementById('modal-backdrop').classList.add('open');
  }

  function closeModal() {
    document.getElementById('modal-backdrop').classList.remove('open');
    unlockScroll();
  }

  async function loadTraders() {
    try {
      const res = await fetch(PROXY_URL);
      if (!res.ok) {
        const body = await res.text().catch(() => '');
        throw new Error(`HTTP ${res.status}${body ? ': ' + body.slice(0, 120) : ''}`);
      }
      const json = await res.json();
      allTraders = json.data || json.traders || (Array.isArray(json) ? json : []);
      if (!allTraders.length) throw new Error('No trader data returned — raw: ' + JSON.stringify(json).slice(0, 120));
      renderGrid(allTraders);
      document.getElementById('status').style.display = 'none';
      document.getElementById('trader-grid').style.display = 'grid';
    } catch (e) {
      const el = document.getElementById('status');
      el.className = 'error';
      el.innerHTML = `&#9888; Failed to load traders: ${e.message}<br>
        <button onclick="location.reload()" style="margin-top:12px;padding:8px 20px;
        background:var(--accent);border:none;border-radius:6px;cursor:pointer;
        font-weight:600;color:#000">Retry</button>`;
    }
  }

  document.getElementById('modal-close').addEventListener('click', closeModal);
  document.getElementById('modal-backdrop').addEventListener('click', e => {
    if (e.target === document.getElementById('modal-backdrop')) closeModal();
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

  document.getElementById('search').addEventListener('input', e => {
    const q = e.target.value.toLowerCase();
    renderGrid(allTraders.filter(t =>
      t.name.toLowerCase().includes(q) ||
      getSubtitle(t).toLowerCase().includes(q) ||
      getDescription(t).toLowerCase().includes(q)
    ));
  });

  loadTraders();
</script>
</body>
</html>
