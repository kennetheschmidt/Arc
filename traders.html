<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arc Raiders – Traders</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0d0f14;
      --surface:  #141720;
      --surface2: #1c2030;
      --border:   #2a2f42;
      --accent:   #e8a020;
      --text:     #e2e8f0;
      --muted:    #6b7280;
      --danger:   #ef4444;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── HEADER ── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo { display: flex; align-items: center; gap: 12px; }
    .logo svg { color: var(--accent); }
    .logo h1 { font-size: 1.25rem; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; }
    .logo h1 span { color: var(--accent); }

    nav { display: flex; gap: 6px; flex-wrap: wrap; }

    .nav-link {
      padding: 6px 14px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      font-size: 0.82rem;
      text-decoration: none;
      transition: all 0.15s;
    }
    .nav-link:hover { border-color: var(--accent); color: var(--accent); }
    .nav-link.active { background: var(--accent); border-color: var(--accent); color: #000; font-weight: 600; }

    /* ── SEARCH ── */
    #search-bar {
      padding: 12px 24px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    #search {
      width: 100%;
      max-width: 400px;
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 0.88rem;
      outline: none;
      transition: border-color 0.15s;
    }
    #search:focus { border-color: var(--accent); }
    #search::placeholder { color: var(--muted); }

    /* ── MAIN ── */
    main { padding: 24px; max-width: 1200px; margin: 0 auto; }

    #trader-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
    }

    /* ── TRADER CARD ── */
    .trader-card {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      cursor: pointer;
      transition: border-color 0.15s, transform 0.15s;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .trader-card:hover { border-color: var(--accent); transform: translateY(-2px); }

    .trader-avatar {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: var(--surface);
      border: 2px solid var(--border);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--accent);
      text-transform: uppercase;
    }

    .trader-info { min-width: 0; }
    .trader-name { font-size: 1rem; font-weight: 700; color: var(--text); }
    .trader-count {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 3px;
    }
    .trader-count span { color: var(--accent); font-weight: 600; }

    /* ── MODAL ── */
    #modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 200;
      padding: 16px;
      align-items: center;
      justify-content: center;
    }
    #modal-backdrop.open { display: flex; }

    #modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      width: 100%;
      max-width: 700px;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #modal-header {
      padding: 18px 20px 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    #modal-name { font-size: 1.2rem; font-weight: 700; }
    #modal-item-count { font-size: 0.75rem; color: var(--muted); margin-top: 2px; }

    .modal-close {
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
      padding: 0 0 2px 12px;
      flex-shrink: 0;
    }
    .modal-close:hover { color: var(--text); }

    /* ── ITEM SEARCH ── */
    #modal-item-search-wrap {
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    #modal-item-search {
      width: 100%;
      padding: 7px 12px;
      border-radius: 7px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 0.85rem;
      outline: none;
    }
    #modal-item-search:focus { border-color: var(--accent); }
    #modal-item-search::placeholder { color: var(--muted); }

    #modal-body {
      overflow-y: auto;
      flex: 1;
      -webkit-overflow-scrolling: touch;
    }

    /* ── INVENTORY TABLE ── */
    .inv-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
    }
    .inv-table th {
      text-align: left;
      color: var(--muted);
      font-weight: 600;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      background: var(--surface);
    }
    .inv-table td {
      padding: 9px 16px;
      border-bottom: 1px solid var(--border);
      color: var(--text);
      vertical-align: middle;
    }
    .inv-table tr:last-child td { border-bottom: none; }
    .inv-table tr:hover td { background: var(--surface2); }

    .item-name-cell {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .item-icon {
      width: 28px;
      height: 28px;
      border-radius: 4px;
      background: var(--surface2);
      object-fit: contain;
      flex-shrink: 0;
    }

    .rarity {
      display: inline-block;
      padding: 1px 7px;
      border-radius: 4px;
      font-size: 0.7rem;
      font-weight: 700;
    }
    .rarity-common    { background: #374151; color: #9ca3af; }
    .rarity-uncommon  { background: #14532d; color: #4ade80; }
    .rarity-rare      { background: #1e3a8a; color: #60a5fa; }
    .rarity-epic      { background: #4a1d96; color: #c084fc; }
    .rarity-legendary { background: #78350f; color: var(--accent); }

    #modal-empty {
      display: none;
      text-align: center;
      padding: 32px;
      color: var(--muted);
      font-size: 0.85rem;
    }

    /* ── LOADING / ERROR ── */
    #status {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
      font-size: 0.9rem;
    }
    #status .spinner {
      width: 32px; height: 32px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #status.error { color: var(--danger); }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="none"
         viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round"
            d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.3 2.3c-.6.6-.2 1.7.7 1.7H17m0 0a2 2 0 100 4 2 2 0 000-4zm-10 2a2 2 0 100 4 2 2 0 000-4z"/>
    </svg>
    <h1>Arc Raiders <span>Traders</span></h1>
  </div>
  <nav>
    <a href="index.html"   class="nav-link">Events</a>
    <a href="arcs.html"    class="nav-link">ARC Units</a>
    <a href="loot.html"    class="nav-link">Loot</a>
    <a href="traders.html" class="nav-link active">Traders</a>
  </nav>
</header>

<div id="search-bar">
  <input id="search" type="search" placeholder="Search traders…" autocomplete="off" />
</div>

<main>
  <div id="status"><div class="spinner"></div>Loading traders…</div>
  <div id="trader-grid" style="display:none"></div>
</main>

<!-- MODAL -->
<div id="modal-backdrop">
  <div id="modal">
    <div id="modal-header">
      <div>
        <div id="modal-name"></div>
        <div id="modal-item-count"></div>
      </div>
      <button class="modal-close" id="modal-close">&#x2715;</button>
    </div>
    <div id="modal-item-search-wrap">
      <input id="modal-item-search" type="search" placeholder="Filter items…" autocomplete="off" />
    </div>
    <div id="modal-body">
      <table class="inv-table">
        <thead>
          <tr>
            <th>Item</th>
            <th>Rarity</th>
            <th>Type</th>
          </tr>
        </thead>
        <tbody id="modal-items"></tbody>
      </table>
      <div id="modal-empty">No items match your search.</div>
    </div>
  </div>
</div>

<footer style="text-align:center;padding:24px;margin-top:32px;border-top:1px solid var(--border);font-size:0.78rem;color:var(--muted)">
  Data provided by <a href="https://metaforge.app/arc-raiders" target="_blank" rel="noopener"
  style="color:var(--accent);text-decoration:none">metaforge.app</a>
</footer>

<script>
  const PROXY_URL = 'https://corsproxy.io/?url=https://metaforge.app/api/arc-raiders/traders';

  let allTraders = [];
  let currentItems = [];

  // iOS Safari scroll lock
  function lockScroll() {
    const y = window.scrollY;
    document.body.style.position = 'fixed';
    document.body.style.top = `-${y}px`;
    document.body.style.width = '100%';
    document.body.dataset.scrollY = y;
  }
  function unlockScroll() {
    const y = parseInt(document.body.dataset.scrollY || '0');
    document.body.style.position = '';
    document.body.style.top = '';
    document.body.style.width = '';
    window.scrollTo(0, y);
  }

  function renderItemRows(items) {
    const tbody = document.getElementById('modal-items');
    const empty = document.getElementById('modal-empty');
    if (!items.length) {
      tbody.innerHTML = '';
      empty.style.display = '';
      return;
    }
    empty.style.display = 'none';
    tbody.innerHTML = items.map(item => {
      const rarity = (item.rarity || '').toLowerCase();
      const icon   = item.icon || item.image || '';
      return `<tr>
        <td>
          <div class="item-name-cell">
            ${icon ? `<img class="item-icon" src="${icon}" alt="" onerror="this.style.display='none'" loading="lazy">` : ''}
            ${item.name || 'Unknown'}
          </div>
        </td>
        <td>${item.rarity ? `<span class="rarity rarity-${rarity}">${item.rarity}</span>` : '<span style="color:var(--muted)">—</span>'}</td>
        <td style="color:var(--muted)">${item.item_type || item.type || item.category || '—'}</td>
      </tr>`;
    }).join('');
  }

  function renderGrid(traders) {
    const grid = document.getElementById('trader-grid');
    grid.innerHTML = '';
    if (!traders.length) {
      grid.innerHTML = '<p style="color:var(--muted);font-size:0.85rem">No traders found.</p>';
      return;
    }
    traders.forEach(trader => {
      const card = document.createElement('div');
      card.className = 'trader-card';
      const initial = trader.name.charAt(0).toUpperCase();
      card.innerHTML = `
        <div class="trader-avatar">${initial}</div>
        <div class="trader-info">
          <div class="trader-name">${trader.name}</div>
          <div class="trader-count"><span>${trader.items.length}</span> item${trader.items.length !== 1 ? 's' : ''}</div>
        </div>`;
      card.addEventListener('click', () => openModal(trader));
      grid.appendChild(card);
    });
  }

  function openModal(trader) {
    lockScroll();
    currentItems = trader.items;
    document.getElementById('modal-name').textContent = trader.name;
    document.getElementById('modal-item-count').textContent = trader.items.length + ' item' + (trader.items.length !== 1 ? 's' : '');
    document.getElementById('modal-item-search').value = '';
    renderItemRows(currentItems);
    document.getElementById('modal-backdrop').classList.add('open');
  }

  function closeModal() {
    document.getElementById('modal-backdrop').classList.remove('open');
    unlockScroll();
  }

  async function loadTraders() {
    try {
      const res = await fetch(PROXY_URL);
      if (!res.ok) {
        const body = await res.text().catch(() => '');
        throw new Error(`HTTP ${res.status}${body ? ': ' + body.slice(0, 120) : ''}`);
      }
      const json = await res.json();
      const raw = json.data;
      if (raw && !Array.isArray(raw) && typeof raw === 'object') {
        allTraders = Object.entries(raw).map(([name, items]) => ({
          name,
          items: Array.isArray(items) ? items : []
        }));
      } else {
        allTraders = Array.isArray(raw) ? raw : [];
      }
      if (!allTraders.length) throw new Error('No trader data returned');
      renderGrid(allTraders);
      document.getElementById('status').style.display = 'none';
      document.getElementById('trader-grid').style.display = 'grid';
    } catch (e) {
      const el = document.getElementById('status');
      el.className = 'error';
      el.innerHTML = `&#9888; Failed to load traders: ${e.message}<br>
        <button onclick="location.reload()" style="margin-top:12px;padding:8px 20px;
        background:var(--accent);border:none;border-radius:6px;cursor:pointer;
        font-weight:600;color:#000">Retry</button>`;
    }
  }

  document.getElementById('modal-close').addEventListener('click', closeModal);
  document.getElementById('modal-backdrop').addEventListener('click', e => {
    if (e.target === document.getElementById('modal-backdrop')) closeModal();
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

  document.getElementById('modal-item-search').addEventListener('input', e => {
    const q = e.target.value.toLowerCase();
    renderItemRows(q ? currentItems.filter(i =>
      (i.name || '').toLowerCase().includes(q) ||
      (i.rarity || '').toLowerCase().includes(q) ||
      (i.item_type || i.type || '').toLowerCase().includes(q)
    ) : currentItems);
  });

  document.getElementById('search').addEventListener('input', e => {
    const q = e.target.value.toLowerCase();
    renderGrid(allTraders.filter(t => t.name.toLowerCase().includes(q)));
  });

  loadTraders();
</script>
</body>
</html>
