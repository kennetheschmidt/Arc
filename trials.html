<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quests – Arc Raiders</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0d0f14;
      --surface:  #141720;
      --surface2: #1c2030;
      --border:   #2a2f42;
      --accent:   #e8a020;
      --red:      #e8423a;
      --green:    #4ade80;
      --purple:   #a78bfa;
      --text:     #e2e8f0;
      --muted:    #6b7280;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── NAV ── */
    nav {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 20px;
      display: flex;
      align-items: center;
      gap: 4px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      flex-shrink: 0;
    }
    nav::-webkit-scrollbar { display: none; }
    nav a {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.78rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 14px 12px;
      white-space: nowrap;
      border-bottom: 2px solid transparent;
      transition: color 0.15s, border-color 0.15s;
    }
    nav a:hover { color: var(--text); }
    nav a.active { color: var(--accent); border-bottom-color: var(--accent); }

    /* ── HEADER ── */
    .page-header {
      padding: 28px 24px 0;
      max-width: 900px;
      margin: 0 auto;
      width: 100%;
    }
    .page-header h1 {
      font-size: 1.4rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .page-header p { font-size: 0.8rem; color: var(--muted); margin-top: 4px; }

    /* ── COUNTDOWN BANNER ── */
    .reset-banner {
      max-width: 900px;
      margin: 16px auto 0;
      width: 100%;
      padding: 0 24px;
    }
    .reset-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 0.8rem;
      color: var(--muted);
    }
    .reset-pill .timer { color: var(--accent); font-weight: 700; font-variant-numeric: tabular-nums; }

    /* ── CONTENT ── */
    .content {
      flex: 1;
      padding: 20px 24px 52px;
      max-width: 900px;
      margin: 0 auto;
      width: 100%;
    }

    /* ── STATUS ── */
    .status {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
      font-size: 0.9rem;
    }
    .spinner {
      width: 32px; height: 32px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── TRIAL CARDS ── */
    .trials-list { display: flex; flex-direction: column; gap: 16px; }

    .trial-card {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }
    .trial-card-header {
      padding: 16px 18px 12px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid var(--border);
    }
    .trial-name {
      font-size: 1rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .trial-desc {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 4px;
      line-height: 1.5;
    }
    .trial-badge {
      flex-shrink: 0;
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 4px 10px;
      border-radius: 20px;
      background: var(--surface);
      color: var(--muted);
      border: 1px solid var(--border);
    }
    .trial-badge.weekly { color: var(--accent); border-color: rgba(232,160,32,0.3); }
    .trial-badge.daily  { color: var(--green);  border-color: rgba(74,222,128,0.3); }

    .trial-body {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
    }
    @media (max-width: 560px) {
      .trial-body { grid-template-columns: 1fr; }
    }

    .trial-section {
      padding: 14px 18px;
    }
    .trial-section + .trial-section {
      border-left: 1px solid var(--border);
    }
    @media (max-width: 560px) {
      .trial-section + .trial-section {
        border-left: none;
        border-top: 1px solid var(--border);
      }
    }

    .section-label {
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .objective-item {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      font-size: 0.82rem;
      margin-bottom: 6px;
      line-height: 1.4;
    }
    .objective-item:last-child { margin-bottom: 0; }
    .obj-bullet {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--accent);
      flex-shrink: 0;
      margin-top: 5px;
    }

    .reward-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.82rem;
      margin-bottom: 6px;
    }
    .reward-item:last-child { margin-bottom: 0; }
    .reward-icon {
      width: 28px; height: 28px;
      border-radius: 4px;
      background: var(--surface);
      object-fit: contain;
      flex-shrink: 0;
    }
    .reward-rarity {
      font-size: 0.68rem;
      font-weight: 600;
      padding: 1px 6px;
      border-radius: 4px;
    }
    .reward-rarity.common   { background: rgba(156,163,175,0.12); color: #9ca3af; }
    .reward-rarity.uncommon { background: rgba(74,222,128,0.12);  color: var(--green); }
    .reward-rarity.rare     { background: rgba(167,139,250,0.15); color: var(--purple); }
    .reward-rarity.epic     { background: rgba(232,160,32,0.15);  color: var(--accent); }
    .reward-rarity.legendary { background: rgba(232,66,58,0.15);  color: var(--red); }

    /* ── PROGRESS INDICATOR ── */
    .trial-progress {
      padding: 10px 18px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .progress-bar-bg {
      flex: 1;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 2px;
      transition: width 0.3s;
    }
    .progress-label { font-size: 0.72rem; color: var(--muted); white-space: nowrap; }

    /* ── PAST TRIALS ACCORDION ── */
    .past-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      padding: 14px 18px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      user-select: none;
      margin-top: 8px;
    }
    .past-header:hover { color: var(--text); border-color: var(--accent); }
    .past-header .chevron { transition: transform 0.2s; font-style: normal; }
    .past-header.open .chevron { transform: rotate(180deg); }
    .past-body { display: none; flex-direction: column; gap: 12px; margin-top: 10px; }
    .past-body.open { display: flex; }

    /* ── DEBUG ── */
    .debug-panel {
      margin-top: 32px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }
    .debug-toggle {
      width: 100%;
      background: none;
      border: none;
      color: var(--muted);
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 12px 16px;
      text-align: left;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
    }
    .debug-toggle:hover { color: var(--text); }
    .debug-body { display: none; padding: 16px; border-top: 1px solid var(--border); }
    .debug-body.open { display: block; }
    .debug-body pre { font-size: 0.72rem; color: var(--muted); white-space: pre-wrap; word-break: break-all; max-height: 400px; overflow-y: auto; }

    /* ── QUEST CONTROLS ── */
    .quest-controls {
      max-width: 900px;
      margin: 16px auto 0;
      width: 100%;
      padding: 0 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    #questSearch {
      width: 100%;
      max-width: 420px;
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text);
      font-size: 0.88rem;
      outline: none;
      transition: border-color 0.15s;
    }
    #questSearch:focus { border-color: var(--accent); }
    #questSearch::placeholder { color: var(--muted); }

    .trader-filters { display: flex; gap: 8px; flex-wrap: wrap; }
    .trader-btn {
      padding: 5px 13px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    .trader-btn:hover { border-color: var(--accent); color: var(--accent); }
    .trader-btn.active { background: var(--accent); border-color: var(--accent); color: #000; }

    .trader-group-label {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--accent);
      margin: 20px 0 10px;
    }
    .trader-group-label:first-child { margin-top: 0; }

    .quest-qty { color: var(--muted); font-size: 0.75rem; }
    .quest-image {
      width: 34px; height: 34px;
      border-radius: 6px;
      object-fit: cover;
      background: var(--surface);
      flex-shrink: 0;
    }
    .quest-title-row { display: flex; align-items: center; gap: 10px; min-width: 0; }
  </style>
</head>
<body>

<nav>
  <a href="index.html">Home</a>
  <a href="events.html">Events</a>
  <a href="arcs.html">ARC Units</a>
  <a href="loot.html">Loot</a>
  <a href="traders.html">Traders</a>
  <a href="trials.html" class="active">Quests</a>
</nav>

<div class="page-header">
  <h1>Quests</h1>
  <p>Objectives, requirements and rewards for every quest, by trader</p>
</div>

<div class="quest-controls">
  <input type="text" id="questSearch" placeholder="Search quests, objectives or items…" />
  <div class="trader-filters" id="traderFilters"></div>
</div>

<div class="content">
  <div class="status" id="status">
    <div class="spinner"></div>
    Loading quests…
  </div>
  <div class="trials-list" id="trialsList" style="display:none"></div>
  <div class="debug-panel" id="debugPanel" style="display:none">
    <button class="debug-toggle" onclick="toggleDebug()">
      <span>Raw API Response</span><span id="debugArrow">▶</span>
    </button>
    <div class="debug-body" id="debugBody">
      <pre id="debugPre"></pre>
    </div>
  </div>
</div>

<script>
// Prefer the same-origin snapshot written by the Refresh Game Data workflow —
// no CORS, and metaforge asks that we not call their API from every browser.
// `quests` is the only real endpoint for this data; weekly-trials and trials
// were guesses and have never existed.
const CACHE_URL = './data/quests.json';
const SOURCE    = 'https://metaforge.app/api/arc-raiders/quests';
const PROXIES = [
  u => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
  u => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(u)}`,
];

const RARITY_ORDER = ['legendary','epic','rare','uncommon','common'];

// ── FETCH ────────────────────────────────────────────────────────────────────
async function fetchWithFallback(cacheUrl, sourceUrl, proxies, log) {
  try {
    const res = await fetch(cacheUrl, { cache: 'no-store' });
    if (res.ok) { log.cache = 'ok'; return await res.json(); }
    log.cache = `HTTP ${res.status}`;
  } catch (e) { log.cache = e.message; }

  for (const proxyFn of proxies) {
    const url = proxyFn(sourceUrl);
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), 8000);
    try {
      const res = await fetch(url, {
        headers: { Accept: 'application/json' },
        cache: 'no-store',
        signal: ctl.signal,
      });
      clearTimeout(timer);
      if (!res.ok) { log[url] = `HTTP ${res.status}`; continue; }
      const text = (await res.text()).trim();
      if (!text.startsWith('{') && !text.startsWith('[')) {
        log[url] = 'non-JSON response';
        continue;
      }
      log[url] = 'ok';
      return JSON.parse(text);
    } catch (e) { clearTimeout(timer); log[url] = e.message; }
  }
  return null;
}

async function loadData() {
  const log = {};
  const json = await fetchWithFallback(CACHE_URL, SOURCE, PROXIES, log);

  if (json) {
    const raw = json.data ?? json;
    const items = Array.isArray(raw) ? raw : null;
    if (items && items.length) {
      allQuests = items;
      buildTraderFilter();
      render();
      return;
    }
    log.parse = 'response contained no quest entries';
  }

  document.getElementById('debugPre').textContent = JSON.stringify(log, null, 2);
  document.getElementById('debugPanel').style.display = '';
  setStatus('Could not load quests — see Raw API Response below.');
}

// ── RENDER ────────────────────────────────────────────────────────────────────
let allQuests = [];
let activeTrader = 'all';
let searchTerm = '';

function traderOf(q) {
  return q.trader_name || 'Unassigned';
}

function matchesSearch(q) {
  if (!searchTerm) return true;
  const hay = [
    q.name,
    ...(Array.isArray(q.objectives) ? q.objectives : []),
    ...mapItems(q.granted_items).map(i => i.name),
    ...mapItems(q.required_items).map(i => i.name),
  ].join(' ').toLowerCase();
  return hay.includes(searchTerm);
}

function buildTraderFilter() {
  const bar = document.getElementById('traderFilters');
  const traders = [...new Set(allQuests.map(traderOf))].sort();
  bar.innerHTML = '';
  [['all', `All (${allQuests.length})`], ...traders.map(t =>
    [t, `${t} (${allQuests.filter(q => traderOf(q) === t).length})`]
  )].forEach(([key, label]) => {
    const btn = document.createElement('button');
    btn.className = 'trader-btn' + (key === activeTrader ? ' active' : '');
    btn.textContent = label;
    btn.addEventListener('click', () => {
      activeTrader = key;
      bar.querySelectorAll('.trader-btn').forEach(b => b.classList.toggle('active', b === btn));
      render();
    });
    bar.appendChild(btn);
  });
}

function render() {
  const list = document.getElementById('trialsList');
  document.getElementById('status').style.display = 'none';
  list.style.display = '';
  list.innerHTML = '';

  const shown = allQuests.filter(q =>
    (activeTrader === 'all' || traderOf(q) === activeTrader) && matchesSearch(q)
  );

  if (!shown.length) {
    list.innerHTML = '<div class="status">No quests match that search.</div>';
    return;
  }

  // Group under trader headings so the list stays navigable at 100 entries.
  const groups = new Map();
  shown.forEach(q => {
    const t = traderOf(q);
    if (!groups.has(t)) groups.set(t, []);
    groups.get(t).push(q);
  });

  [...groups.keys()].sort().forEach(trader => {
    const label = document.createElement('div');
    label.className = 'trader-group-label';
    label.textContent = `${trader} — ${groups.get(trader).length} quest${groups.get(trader).length === 1 ? '' : 's'}`;
    list.appendChild(label);
    groups.get(trader).forEach(q => list.appendChild(buildCard(q)));
  });
}

function normaliseObjectives(raw) {
  if (!Array.isArray(raw)) return [];
  return raw.map(o => {
    if (typeof o === 'string') return o;
    return o.description || o.text || o.name || o.title || o.objective || JSON.stringify(o);
  });
}

function mapItems(raw) {
  if (!Array.isArray(raw)) return [];
  return raw.map(r => {
    const it = r.item || {};
    return {
      name:   it.name || r.item_id || 'Unknown',
      icon:   it.icon || '',
      rarity: (it.rarity || '').toLowerCase(),
      qty:    r.quantity || 1,
    };
  });
}

function itemRow(i) {
  return `
    <div class="reward-item">
      ${i.icon ? `<img class="reward-icon" src="${esc(i.icon)}" alt="" onerror="this.style.display='none'">` : ''}
      <span>${esc(i.name)}</span>
      ${i.qty > 1 ? `<span class="quest-qty">x${i.qty}</span>` : ''}
      ${i.rarity ? `<span class="reward-rarity ${esc(i.rarity)}">${esc(i.rarity)}</span>` : ''}
    </div>`;
}

function buildCard(q) {
  const objectives = normaliseObjectives(q.objectives);
  const rewards    = mapItems(q.granted_items);
  const required   = mapItems(q.required_items);

  const card = document.createElement('div');
  card.className = 'trial-card';
  card.innerHTML = `
    <div class="trial-card-header">
      <div class="quest-title-row">
        ${q.image ? `<img class="quest-image" src="${esc(q.image)}" alt="" onerror="this.style.display='none'">` : ''}
        <div class="trial-name">${esc(q.name || q.id || 'Unknown Quest')}</div>
      </div>
      ${q.guide_url
        ? `<a class="trial-badge" href="https://metaforge.app${esc(q.guide_url)}" target="_blank" rel="noopener">Guide</a>`
        : ''}
    </div>
    <div class="trial-body">
      <div class="trial-section">
        <div class="section-label">Objectives</div>
        ${objectives.length
          ? objectives.map(o => `<div class="objective-item"><div class="obj-bullet"></div><span>${esc(o)}</span></div>`).join('')
          : `<div style="font-size:0.8rem;color:var(--muted)">No objectives listed.</div>`}
      </div>
      <div class="trial-section">
        <div class="section-label">${required.length ? 'Required Items' : 'Rewards'}</div>
        ${required.length ? required.map(itemRow).join('') : ''}
        ${required.length && rewards.length
          ? `<div class="section-label" style="margin-top:12px">Rewards</div>` : ''}
        ${rewards.length ? rewards.map(itemRow).join('') : ''}
        ${!required.length && !rewards.length
          ? `<div style="font-size:0.8rem;color:var(--muted)">Nothing listed.</div>` : ''}
      </div>
    </div>
  `;
  return card;
}

function setStatus(msg) {
  const el = document.getElementById('status');
  el.innerHTML = `<div style="color:var(--red)">${msg}</div>`;
  el.style.display = '';
}

function toggleDebug() {
  const body  = document.getElementById('debugBody');
  const arrow = document.getElementById('debugArrow');
  body.classList.toggle('open');
  arrow.textContent = body.classList.contains('open') ? '▼' : '▶';
}

function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

let searchTimer = null;
document.getElementById('questSearch').addEventListener('input', e => {
  clearTimeout(searchTimer);
  const v = e.target.value.trim().toLowerCase();
  searchTimer = setTimeout(() => { searchTerm = v; render(); }, 150);
});

loadData();
</script>
</body>
</html>
